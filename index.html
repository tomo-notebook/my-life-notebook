    openDiary(diaryDate);

    // ============================================
    //  予定と目標（Plans）
    // ============================================
    // 予定： [{ date: "2026-10-09", time: "14:00", text: "歯医者" }, ...]
    let events = JSON.parse(localStorage.getItem("events") || "[]");
    // 目標： { "month:2026-10": [{ text, done }], "week:2026-10-05": [...] }
    let goals = JSON.parse(localStorage.getItem("goals") || "{}");

    // 「月」か「週」か（前回のものを覚えておく）
    let planView = localStorage.getItem("planView") === "week" ? "week" : "month";
    // いま見ている月・週の中の1日
    let planCursor = new Date();
    // 予定を表示・追加する日
    let selectedDate = dateKey(new Date());
    // いま書き直している予定（書き直していないときは null）
    let editingEvent = null;
    // 週の表で、いま予定を書いている枠（{ date, time } または null）
    let editingSlot = null;
    // 枠に書きかけの予定を保存する関数（書いていないときは null）
    let saveSlotInput = null;

    // 予定の種類と色（ここを書きかえると、種類や色を変えられます）
    // ※ 色は、となりどうしが見分けやすいか検証ずみの組み合わせです
    //   （順番を入れかえると見分けにくくなることがあります）
    const EVENT_TYPES = [
      { name: "仕事", color: "#2a78d6" },
      { name: "勉強", color: "#eb6834" },
      { name: "趣味", color: "#1baf7a" },
      { name: "用事", color: "#eda100" },
      { name: "家族", color: "#e87ba4" },
      { name: "プライベート", color: "#008300" },
      { name: "睡眠", color: "#4a3aa7" },
      { name: "その他", color: "#9a958c" }
    ];

    // 種類がない予定（前に追加したもの）は「その他」として扱う
    function typeOf(event) {
      const found = EVENT_TYPES.find(function (type) { return type.name === event.type; });
      return found || EVENT_TYPES[EVENT_TYPES.length - 1];
    }

    // 種類を選ぶ欄に、種類の一覧を入れる
    function fillTypeSelect(select, selected) {
      EVENT_TYPES.forEach(function (type) {
        const option = document.createElement("option");
        option.value = type.name;
        option.textContent = type.name;
        select.appendChild(option);
      });
      select.value = selected;
    }

    // 時間の枠に出す時間（0時〜23時の24時間）
    const FIRST_HOUR = 0;
    const LAST_HOUR = 23;

    const planHeading = document.getElementById("plan-heading");
    const monthGoalHeading = document.getElementById("month-goal-heading");
    const monthGoalList = document.getElementById("month-goal-list");
    const monthGoalInput = document.getElementById("month-goal-input");
    const weekGoalBox = document.getElementById("week-goal-box");
    const weekGoalList = document.getElementById("week-goal-list");
    const weekGoalInput = document.getElementById("week-goal-input");
    const monthView = document.getElementById("month-view");
    const weekView = document.getElementById("week-view");
    const dayHeading = document.getElementById("day-heading");
    const dayEvents = document.getElementById("day-events");
    const dayTimeline = document.getElementById("day-timeline");
    const dayChart = document.getElementById("day-chart");
    const dayEmptyMessage = document.getElementById("day-empty-message");
    const eventInput = document.getElementById("event-input");
    const eventTimeInput = document.getElementById("event-time-input");
    const eventEndInput = document.getElementById("event-end-input");
    const eventTypeInput = document.getElementById("event-type-input");
    fillTypeSelect(eventTypeInput, "その他");
    const viewButtons = document.querySelectorAll(".view-switch button");

    function saveEvents() {
      localStorage.setItem("events", JSON.stringify(events));
      notifySaved("events");
    }
    function saveGoals() {
      localStorage.setItem("goals", JSON.stringify(goals));
      notifySaved("goals");
    }

    // その週の月曜日
    function mondayOf(date) {
      const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7);
      return monday;
    }

    // 何日かあとの日
    function addDays(date, count) {
      const day = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      day.setDate(day.getDate() + count);
      return day;
    }

    // ある日の予定（時間のないものが先、あとは時間の早い順）
    function eventsOn(key) {
      return events
        .filter(function (event) { return event.date === key; })
        .sort(function (a, b) {
          return (a.time || "") < (b.time || "") ? -1 : (a.time || "") > (b.time || "") ? 1 : 0;
        });
    }

    // 曜日に色をつける
    function weekdayClass(day) {
      return day.getDay() === 0 ? "sun" : day.getDay() === 6 ? "sat" : "";
    }

    // いま見ている月・週の目標の名前
    function monthGoalKey() {
      return "month:" + dateKey(planCursor).slice(0, 7);
    }
    function weekGoalKey() {
      return "week:" + dateKey(mondayOf(planCursor));
    }

    // ページ全体を表示する
    function showPlans() {
      // 枠に書きかけの予定があれば、表示しなおす前に保存する（「次の週」などを押したとき用）
      if (saveSlotInput) saveSlotInput();
      viewButtons.forEach(function (button) {
        button.classList.toggle("active", button.dataset.view === planView);
      });
      monthView.hidden = planView !== "month";
      weekView.hidden = planView !== "week";

      if (planView === "month") {
        planHeading.textContent = planCursor.getFullYear() + "年" + (planCursor.getMonth() + 1) + "月";
        showMonth();
      } else {
        const monday = mondayOf(planCursor);
        const sunday = addDays(monday, 6);
        planHeading.textContent = (monday.getMonth() + 1) + "/" + monday.getDate() + " 〜 " +
          (sunday.getMonth() + 1) + "/" + sunday.getDate();
        showWeek();
      }
      // 月の目標は、月・週のどちらでも表示する。週の目標は、週のときだけ
      monthGoalHeading.textContent = (planCursor.getMonth() + 1) + "月の目標";
      weekGoalBox.hidden = planView !== "week";
      showGoals();
      showDay();
    }

    // 目標を表示する（月の目標と、週の目標）
    function showGoals() {
      showGoalList(monthGoalKey(), monthGoalList);
      if (planView === "week") {
        showGoalList(weekGoalKey(), weekGoalList);
      }
    }

    // key の目標を、listElement の中に表示する
    function showGoalList(key, listElement) {
      const list = goals[key] || [];
      listElement.innerHTML = "";
      list.forEach(function (goal) {
        const li = document.createElement("li");
        if (goal.done) {
          li.classList.add("done");
        }
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = goal.done;
        checkbox.addEventListener("change", function () {
          goal.done = checkbox.checked;
          saveGoals();
          showGoals();
        });
        const text = document.createElement("span");
        text.textContent = goal.text;
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除";
        deleteButton.className = "delete-button";
        deleteButton.addEventListener("click", function () {
          list.splice(list.indexOf(goal), 1);
          if (list.length === 0) {
            delete goals[key];
          }
          saveGoals();
          showGoals();
        });
        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(deleteButton);
        listElement.appendChild(li);
      });
    }

    // 目標を追加する
    function addGoal(key, inputElement) {
      const text = inputElement.value.trim();
      if (text === "") {
        return;
      }
      if (!goals[key]) {
        goals[key] = [];
      }
      goals[key].push({ text: text, done: false });
      inputElement.value = "";
      saveGoals();
      showGoals();
    }

    // 日を選ぶ（その日の予定が下に出る）
    function selectDate(key) {
      selectedDate = key;
      editingEvent = null;
      editingSlot = null;
      showPlans();
    }

    // 月のカレンダーを表示する
    function showMonth() {
      monthView.innerHTML = "";
      const grid = document.createElement("div");
      grid.className = "cal-grid";

      WEEKDAYS.forEach(function (name, index) {
        const head = document.createElement("div");
        head.className = "cal-weekday " + (index === 0 ? "sun" : index === 6 ? "sat" : "");
        head.textContent = name;
        grid.appendChild(head);
      });

      // カレンダーの最初のマス（1日の週の日曜日）から、月末の週の土曜日まで
      const first = new Date(planCursor.getFullYear(), planCursor.getMonth(), 1);
      const last = new Date(planCursor.getFullYear(), planCursor.getMonth() + 1, 0);
      const start = addDays(first, -first.getDay());
      const end = addDays(last, 6 - last.getDay());
      const todayKey = dateKey(new Date());

      for (let day = start; day <= end; day = addDays(day, 1)) {
        const key = dateKey(day);
        const cell = document.createElement("div");
        cell.className = "cal-cell";
        if (day.getMonth() !== planCursor.getMonth()) cell.classList.add("other-month");
        if (key === todayKey) cell.classList.add("today");
        if (key === selectedDate) cell.classList.add("selected");

        const number = document.createElement("span");
        number.className = "cal-day " + weekdayClass(day);
        number.textContent = day.getDate();
        cell.appendChild(number);

        // 予定は3つまで表示して、それ以上は「ほか○件」
        const list = eventsOn(key);
        list.slice(0, 3).forEach(function (event) {
          const line = document.createElement("div");
          line.className = "cal-event";
          line.style.borderLeftColor = typeOf(event).color;
          line.textContent = (event.time ? event.time + " " : "") + event.text;
          line.title = line.textContent;
          cell.appendChild(line);
        });
        if (list.length > 3) {
          const more = document.createElement("div");
          more.className = "cal-more";
          more.textContent = "ほか" + (list.length - 3) + "件";
          cell.appendChild(more);
        }

        cell.addEventListener("click", function () {
          selectDate(key);
        });
        grid.appendChild(cell);
      }
      monthView.appendChild(grid);
    }

    // 「14:00〜15:30」のように、予定の時間を文字にする
    function timeRange(event) {
      if (!event.time) {
        return "";
      }
      if (!event.endTime) {
        return event.time;
      }
      return event.time + "〜" + (isOvernight(event) ? "翌" : "") + event.endTime;
    }

    // 終了が次の日になる予定か（例：23:00〜7:00 の睡眠）
    function isOvernight(event) {
      return Boolean(event.time && event.endTime && event.endTime < event.time);
    }

    // 1時間あとの時刻（「14:00」→「15:00」、「23:00」→「00:00」＝次の日）
    function oneHourLater(time) {
      const hour = Number(time.slice(0, 2));
      return String((hour + 1) % 24).padStart(2, "0") + time.slice(2);
    }

    // 開始・終了時間が正しいか調べる（だめなときはお知らせして false）
    function checkTimes(start, end) {
      if (end && !start) {
        alert("終了時間を入れるときは、開始時間も入れてください。");
        return false;
      }
      if (start && end && end === start) {
        alert("開始時間と終了時間が同じです。");
        return false;
      }
      // 終了が開始より前のときは「次の日まで」の予定として扱う（例：23:00〜7:00）
      return true;
    }

    // 予定が、この時間の行に「つづき」としてかかっているか
    function continuesInto(event, hour) {
      if (!event.time || !event.endTime || hour === -1) {
        return false;
      }
      if (isOvernight(event)) {
        return hourRowOf(event) < hour; // 次の日まで続くので、その日の最後まで
      }
      return hourRowOf(event) < hour && event.endTime > String(hour).padStart(2, "0") + ":00";
    }

    // 前の日から続いている予定が、この時間の行にかかっているか（例：前の日 23:00〜7:00 の 0時〜6時）
    function continuesFromYesterday(event, hour) {
      return isOvernight(event) && hour !== -1 && event.endTime > String(hour).padStart(2, "0") + ":00";
    }

    // 予定を、時間の枠のどの行に入れるか（時間なしは -1）
    function hourRowOf(event) {
      if (!event.time) {
        return -1;
      }
      const hour = Number(event.time.slice(0, 2));
      return Math.min(Math.max(hour, FIRST_HOUR), LAST_HOUR); // 念のため、0〜23時の中におさめる
    }

    // 週の一覧を表示する（日にちを押すと、その日の時間の枠が下に出る）
    function showWeek() {
      weekView.innerHTML = "";
      const monday = mondayOf(planCursor);
      const todayKey = dateKey(new Date());

      for (let i = 0; i < 7; i++) {
        const day = addDays(monday, i);
        const key = dateKey(day);
        const li = document.createElement("li");
        if (key === todayKey) li.classList.add("today");
        if (key === selectedDate) li.classList.add("selected");

        const label = document.createElement("span");
        label.className = "week-day";
        label.textContent = (day.getMonth() + 1) + "/" + day.getDate() + "（";
        const weekday = document.createElement("span");
        weekday.className = weekdayClass(day);
        weekday.textContent = WEEKDAYS[day.getDay()];
        label.appendChild(weekday);
        label.appendChild(document.createTextNode("）"));

        const box = document.createElement("div");
        box.className = "week-events";
        eventsOn(key).forEach(function (event) {
          const line = document.createElement("div");
          if (event.time) {
            const time = document.createElement("small");
            time.className = "event-time";
            time.textContent = timeRange(event);
            line.appendChild(time);
          }
          const dot = document.createElement("span");
          dot.className = "type-dot";
          dot.style.background = typeOf(event).color;
          dot.title = typeOf(event).name;
          line.appendChild(dot);
          line.appendChild(document.createTextNode(event.text));
          box.appendChild(line);
        });

        li.appendChild(label);
        li.appendChild(box);
        li.addEventListener("click", function () {
          if (saveSlotInput) saveSlotInput();
          selectDate(key);
        });
        weekView.appendChild(li);
      }
    }

    // 予定を書き直す入力欄を作る
    function makeEventEditForm(event) {
      const form = document.createElement("div");
      form.className = "small-form";
      form.style.flex = "1";
      form.style.marginTop = "0";
      const timeEdit = document.createElement("input");
      timeEdit.type = "time";
      timeEdit.value = event.time || "";
      const separator = document.createElement("span");
      separator.className = "time-separator";
      separator.textContent = "〜";
      const endEdit = document.createElement("input");
      endEdit.type = "time";
      endEdit.value = event.endTime || "";
      const typeEdit = document.createElement("select");
      fillTypeSelect(typeEdit, typeOf(event).name);
      const textEdit = document.createElement("input");
      textEdit.type = "text";
      textEdit.value = event.text;
      const saveButton = document.createElement("button");
      saveButton.textContent = "保存";
      saveButton.addEventListener("click", function () {
        const newText = textEdit.value.trim();
        if (newText === "" || !checkTimes(timeEdit.value, endEdit.value)) {
          return;
        }
        event.text = newText;
        event.time = timeEdit.value;
        event.endTime = endEdit.value;
        event.type = typeEdit.value;
        editingEvent = null;
        saveEvents();
        showPlans();
      });
      const cancelButton = document.createElement("button");
      cancelButton.textContent = "やめる";
      cancelButton.className = "cancel-button";
      cancelButton.addEventListener("click", function () {
        editingEvent = null;
        showDay();
      });
      form.appendChild(timeEdit);
      form.appendChild(separator);
      form.appendChild(endEdit);
      form.appendChild(typeEdit);
      form.appendChild(textEdit);
      form.appendChild(saveButton);
      form.appendChild(cancelButton);
      return form;
    }

    // 予定1つ分の行を作る（時間・内容・編集・削除）
    function makeEventItem(event) {
      const li = document.createElement("li");
      if (event === editingEvent) {
        li.appendChild(makeEventEditForm(event));
        return li;
      }

      const time = document.createElement("small");
      time.className = "event-time";
      time.textContent = timeRange(event);
      time.style.width = "7.5em";
      const text = document.createElement("span");
      text.textContent = event.text;

      const editButton = document.createElement("button");
      editButton.textContent = "編集";
      editButton.className = "edit-button";
      editButton.addEventListener("click", function () {
        if (saveSlotInput) saveSlotInput();
        editingSlot = null;
        editingEvent = event;
        showDay();
      });
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "削除";
      deleteButton.className = "delete-button";
      deleteButton.addEventListener("click", function () {
        if (saveSlotInput) saveSlotInput();
        events.splice(events.indexOf(event), 1);
        saveEvents();
        showPlans();
      });

      const typeTag = document.createElement("small");
      typeTag.className = "type-tag";
      typeTag.textContent = typeOf(event).name;
      typeTag.style.color = typeOf(event).color;
      typeTag.style.borderColor = typeOf(event).color;

      li.appendChild(time);
      li.appendChild(typeTag);
      li.appendChild(text);
      li.appendChild(editButton);
      li.appendChild(deleteButton);
      return li;
    }

    // 選んだ日の予定を表示する
    // （月のときは一覧、週のときは時間の枠）
    function showDay() {
      const day = parseDate(selectedDate);
      dayHeading.textContent = (day.getMonth() + 1) + "月" + day.getDate() + "日（" + WEEKDAYS[day.getDay()] + "）の予定";
      const list = eventsOn(selectedDate);

      showDayChart();
      dayEvents.innerHTML = "";
      dayTimeline.innerHTML = "";
      dayTimeline.hidden = planView !== "week";
      dayEvents.hidden = planView === "week";

      if (planView === "week") {
        dayEmptyMessage.hidden = true;
        showTimeline(list);
        return;
      }

      dayEmptyMessage.hidden = list.length > 0;
      list.forEach(function (event) {
        dayEvents.appendChild(makeEventItem(event));
      });
    }

    // 「510分」を「8時間30分」にする
    function formatMinutes(minutes) {
      const hours = Math.floor(minutes / 60);
      const rest = minutes % 60;
      if (hours === 0) return rest + "分";
      return hours + "時間" + (rest ? rest + "分" : "");
    }

    // 「14:30」を、0時からの分（870）にする
    function toMinutes(time) {
      return Number(time.slice(0, 2)) * 60 + Number(time.slice(3, 5));
    }

    // 選んだ日の24時間（1440分）が、どの種類に使われたかを数える
    // ・開始と終了の両方がある予定だけを数える
    // ・前の日から続く予定（夜またぎ）は、0時からの分を数える
    // ・予定が重なっているところは、先に始まる予定の種類にする（24時間を超えないように）
    function minutesByType(key) {
      const totals = {};
      minuteMap(key).forEach(function (type) {
        if (type !== null) totals[type] = (totals[type] || 0) + 1;
      });
      return totals;
    }

    // 1日の1分ごとに、どの種類の予定が入っているか（入っていない分は null）
    function minuteMap(key) {
      const minutes = new Array(24 * 60).fill(null);
      function fill(from, to, type) {
        for (let m = from; m < to; m++) {
          if (minutes[m] === null) minutes[m] = type;
        }
      }
      eventsOn(dateKey(addDays(parseDate(key), -1))).forEach(function (event) {
        if (isOvernight(event)) fill(0, toMinutes(event.endTime), typeOf(event).name);
      });
      eventsOn(key).forEach(function (event) {
        if (!event.time || !event.endTime) return;
        const end = isOvernight(event) ? 24 * 60 : toMinutes(event.endTime);
        fill(toMinutes(event.time), end, typeOf(event).name);
      });
      return minutes;
    }

    // 0時からの分（870）を「14:30」にする
    function fromMinutes(total) {
      return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
    }

    // 0時からの分を、時間の入力欄に入れる形（「07:30」）にする。24:00 は「00:00」（＝次の日の0時）
    function toTimeValue(total) {
      total = total % (24 * 60);
      return String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
    }

    // 記録がない時間を [{ from: 420, to: 480 }, ...]（0時からの分）の形で並べる
    function untrackedRanges(key) {
      const minutes = minuteMap(key);
      const ranges = [];
      let start = null;
      for (let m = 0; m <= minutes.length; m++) {
        const empty = m < minutes.length && minutes[m] === null;
        if (empty && start === null) {
          start = m;
        } else if (!empty && start !== null) {
          ranges.push({ from: start, to: m });
          start = null;
        }
      }
      return ranges;
    }

    // 1日の時間の使い方を、円グラフと一覧で表示する
    function showDayChart() {
      const totals = minutesByType(selectedDate);
      dayChart.innerHTML = "";
      const tracked = Object.keys(totals).reduce(function (sum, name) { return sum + totals[name]; }, 0);
      dayChart.hidden = tracked === 0;
      if (tracked === 0) {
        return;
      }
      const DAY = 24 * 60;
      const SVG = "http://www.w3.org/2000/svg";

      // 円グラフ（ドーナツ型）
      const size = 168;
      const radius = 64;
      const thickness = 26;
      const circumference = 2 * Math.PI * radius;
      const svg = document.createElementNS(SVG, "svg");
      svg.setAttribute("width", size);
      svg.setAttribute("height", size);
      svg.setAttribute("viewBox", "0 0 " + size + " " + size);
      svg.setAttribute("role", "img");

      // 下地（記録していない時間）
      const track = document.createElementNS(SVG, "circle");
      track.setAttribute("cx", size / 2);
      track.setAttribute("cy", size / 2);
      track.setAttribute("r", radius);
      track.setAttribute("fill", "none");
      track.setAttribute("stroke", "var(--line)");
      track.setAttribute("stroke-width", thickness);
      svg.appendChild(track);

      // 種類ごとのかけら（種類の順番どおりに、時計回りに並べる。かけらの間に2pxのすき間）
      const tip = document.createElement("div");
      tip.className = "chart-tip";
      tip.hidden = true;
      const used = EVENT_TYPES.filter(function (type) { return totals[type.name]; });
      let offset = 0;
      used.forEach(function (type) {
        const value = totals[type.name];
        const length = value / DAY * circumference;
        const slice = document.createElementNS(SVG, "circle");
        slice.setAttribute("class", "slice");
        slice.setAttribute("cx", size / 2);
        slice.setAttribute("cy", size / 2);
        slice.setAttribute("r", radius);
        slice.setAttribute("fill", "none");
        slice.setAttribute("stroke", type.color);
        slice.setAttribute("stroke-width", thickness);
        slice.setAttribute("stroke-dasharray", Math.max(length - 2, 0.5) + " " + circumference);
        slice.setAttribute("stroke-dashoffset", -offset);
        slice.setAttribute("transform", "rotate(-90 " + size / 2 + " " + size / 2 + ")");
        const label = type.name + "　" + formatMinutes(value) + "（" + Math.round(value / DAY * 100) + "%）";
        // マウスをのせると、くわしい時間を表示する
        slice.addEventListener("mousemove", function (mouseEvent) {
          tip.textContent = label;
          tip.hidden = false;
          tip.style.left = (mouseEvent.clientX + 12) + "px";
          tip.style.top = (mouseEvent.clientY + 12) + "px";
        });
        slice.addEventListener("mouseleave", function () {
          tip.hidden = true;
        });
        svg.appendChild(slice);
        offset += length;
      });

      // まん中に、記録した時間の合計
      const centerLabel = document.createElementNS(SVG, "text");
      centerLabel.setAttribute("x", size / 2);
      centerLabel.setAttribute("y", size / 2 - 6);
      centerLabel.setAttribute("text-anchor", "middle");
      centerLabel.setAttribute("class", "chart-center-label");
      centerLabel.textContent = "記録した時間";
      const centerValue = document.createElementNS(SVG, "text");
      centerValue.setAttribute("x", size / 2);
      centerValue.setAttribute("y", size / 2 + 16);
      centerValue.setAttribute("text-anchor", "middle");
      centerValue.setAttribute("class", "chart-center-value");
      centerValue.textContent = formatMinutes(tracked);
      svg.appendChild(centerLabel);
      svg.appendChild(centerValue);

      // 横の一覧（色・種類・時間・割合）。色だけでなく文字でも分かるように
      const legend = document.createElement("table");
      legend.className = "chart-legend";
      function addRow(color, name, value, className) {
        const tr = document.createElement("tr");
        if (className) tr.className = className;
        const nameCell = document.createElement("td");
        const dot = document.createElement("span");
        dot.className = "type-dot";
        dot.style.background = color;
        nameCell.appendChild(dot);
        nameCell.appendChild(document.createTextNode(name));
        const valueCell = document.createElement("td");
        valueCell.className = "num";
        valueCell.textContent = formatMinutes(value);
        const percentCell = document.createElement("td");
        percentCell.className = "percent";
        percentCell.textContent = Math.round(value / DAY * 100) + "%";
        tr.appendChild(nameCell);
        tr.appendChild(valueCell);
        tr.appendChild(percentCell);
        legend.appendChild(tr);
      }
      used.forEach(function (type) {
        addRow(type.color, type.name, totals[type.name]);
      });
      if (tracked < DAY) {
        addRow("var(--line)", "記録なし", DAY - tracked, "untracked");
      }

      const note = document.createElement("p");
      note.className = "chart-note";
      note.textContent = "※ 開始と終了の両方の時間が入っている予定だけを数えています";

      // 100% にならないときの手がかり
      const check = document.createElement("div");
      check.className = "chart-check";
      const gaps = untrackedRanges(selectedDate);
      const noEnd = eventsOn(selectedDate).filter(function (event) { return event.time && !event.endTime; });
      const noTime = eventsOn(selectedDate).filter(function (event) { return !event.time; });
      function addCheckLine(title, text) {
        const line = document.createElement("div");
        const label = document.createElement("strong");
        label.textContent = title;
        line.appendChild(label);
        line.appendChild(document.createTextNode(text));
        check.appendChild(line);
      }
      if (gaps.length > 0) {
        // 記録がない時間は、押すと下の追加欄にその時間が入る
        const line = document.createElement("div");
        const label = document.createElement("strong");
        label.textContent = "記録がない時間";
        line.appendChild(label);
        gaps.forEach(function (gap) {
          const button = document.createElement("button");
          button.className = "gap-button";
          button.textContent = fromMinutes(gap.from) + "〜" + fromMinutes(gap.to);
          button.title = "押すと、この時間の予定を書けます";
          button.addEventListener("click", function () {
            eventTimeInput.value = toTimeValue(gap.from);
            eventEndInput.value = toTimeValue(gap.to);
            eventInput.focus();
          });
          line.appendChild(button);
        });
        check.appendChild(line);
      }
      if (noEnd.length > 0) {
        addCheckLine("終了時間が入っていない予定", noEnd.map(function (event) {
          return event.time + " " + event.text;
        }).join("、") + "（「編集」で終了時間を入れると数えられます）");
      }
      if (noTime.length > 0) {
        addCheckLine("時間が入っていない予定", noTime.map(function (event) {
          return event.text;
        }).join("、"));
      }
      if (gaps.length === 0) {
        addCheckLine("24時間すべて記録できています", "");
      }

      dayChart.appendChild(svg);
      dayChart.appendChild(legend);
      dayChart.appendChild(check);
      dayChart.appendChild(note);
      dayChart.appendChild(tip);
    }

    // 選んだ日の時間の枠（時間なし・0時〜23時）を表示する
    function showTimeline(list) {
      const yesterdayList = eventsOn(dateKey(addDays(parseDate(selectedDate), -1)));
      const tbody = document.createElement("tbody");
      for (let hour = -1; hour <= LAST_HOUR; hour = hour === -1 ? FIRST_HOUR : hour + 1) {
        const slotTime = hour === -1 ? "" : String(hour).padStart(2, "0") + ":00";
        const row = document.createElement("tr");
        if (hour === -1) row.className = "all-day";

        const label = document.createElement("th");
        label.textContent = hour === -1 ? "時間なし" : hour + ":00";
        row.appendChild(label);

        const cell = document.createElement("td");

        // この時間の予定
        const hourEvents = list.filter(function (event) { return hourRowOf(event) === hour; });
        if (hourEvents.length > 0) {
          const ul = document.createElement("ul");
          hourEvents.forEach(function (event) {
            ul.appendChild(makeEventItem(event));
          });
          cell.appendChild(ul);
        }

        // 前の時間（や前の日）から続いている予定は、うすく「つづき」を表示する
        const continued = list.filter(function (event) { return continuesInto(event, hour); })
          .concat(yesterdayList.filter(function (event) { return continuesFromYesterday(event, hour); }));
        continued.forEach(function (event) {
          const line = document.createElement("div");
          line.className = "continued";
          line.style.borderLeftColor = typeOf(event).color;
          line.textContent = event.text + "（〜" + (isOvernight(event) && event.date === selectedDate ? "翌" : "") + event.endTime + "）";
          cell.appendChild(line);
        });

        // 押した枠に、予定を書く入力欄を出す
        if (editingSlot && editingSlot.date === selectedDate && editingSlot.time === slotTime) {
          cell.appendChild(makeSlotInput(selectedDate, slotTime));
        }

        // 枠を押しても入力欄から離れないようにして、押した動きを確実に受け取る
        cell.addEventListener("mousedown", function (mouseEvent) {
          if (!mouseEvent.target.closest("input, button, select")) {
            mouseEvent.preventDefault();
          }
        });
        // 枠の空いているところを押すと、その時間に予定を書ける
        cell.addEventListener("click", function (clickEvent) {
          if (clickEvent.target.closest("li, .slot-form")) {
            return; // 予定や入力欄を押したときは何もしない
          }
          if (saveSlotInput) saveSlotInput(); // 書きかけの予定があれば、先に保存する
          editingEvent = null;
          editingSlot = { date: selectedDate, time: slotTime };
          showPlans();
        });

        row.appendChild(cell);
        tbody.appendChild(row);
      }
      dayTimeline.appendChild(tbody);
    }

    // 枠の中に出す、予定を書く入力欄を作る（開始・終了・種類・予定・追加・やめる）
    function makeSlotInput(key, slotTime) {
      const form = document.createElement("div");
      form.className = "small-form slot-form";

      // 開始時間（押した枠の時間）と終了時間（ひとまず1時間後）。どちらも変えられる
      const startInput = document.createElement("input");
      startInput.type = "time";
      startInput.value = slotTime;
      const separator = document.createElement("span");
      separator.className = "time-separator";
      separator.textContent = "〜";
      const endInput = document.createElement("input");
      endInput.type = "time";
      endInput.value = slotTime ? oneHourLater(slotTime) : "";

      // 種類（最後に選んだ種類がはじめから選ばれている）
      const typeSelect = document.createElement("select");
      fillTypeSelect(typeSelect, eventTypeInput.value);

      const input = document.createElement("input");
      input.type = "text";
      input.className = "slot-input";
      input.placeholder = (slotTime || "時間なし") + " の予定";

      const addButton = document.createElement("button");
      addButton.textContent = "追加";
      const cancelButton = document.createElement("button");
      cancelButton.textContent = "やめる";
      cancelButton.className = "cancel-button";

      let finished = false;
      // save: 書いた内容を残すか / redraw: 表示しなおすか
      function finish(save, redraw) {
        if (finished) return;
        const text = input.value.trim();
        let start = startInput.value;
        let end = endInput.value;
        if (save && text !== "") {
          if (redraw && !checkTimes(start, end)) {
            return; // 時間がおかしいときは、お知らせを出して入力欄をそのままにする
          }
          if (!redraw && ((end && !start) || (start && end === start))) {
            end = ""; // ほかの場所を押したときは、おかしい終了時間だけ外して保存する
          }
          events.push({ date: key, time: start, endTime: end, type: typeSelect.value, text: text });
          saveEvents();
        }
        finished = true;
        saveSlotInput = null;
        // 選んだ種類を覚えておく（次に書くときも同じ種類から始まる）
        eventTypeInput.value = typeSelect.value;
        editingSlot = null;
        if (redraw) showPlans();
      }
      // ほかの枠を押したときは、書いた内容を残す
      saveSlotInput = function () { finish(true, false); };

      // 時間の欄・予定の欄のどこで Enter を押しても追加、Esc でやめる
      form.addEventListener("keydown", function (keyEvent) {
        if (isEnterToAdd(keyEvent)) {
          finish(true, true);
        } else if (keyEvent.key === "Escape") {
          finish(false, true);
        }
      });
      addButton.addEventListener("click", function () { finish(true, true); });
      cancelButton.addEventListener("click", function () { finish(false, true); });

      form.appendChild(startInput);
      form.appendChild(separator);
      form.appendChild(endInput);
      form.appendChild(typeSelect);
      form.appendChild(input);
      form.appendChild(addButton);
      form.appendChild(cancelButton);
      setTimeout(function () { input.focus(); }, 0);
      return form;
    }

    function addEvent() {
      const text = eventInput.value.trim();
      if (text === "" || !checkTimes(eventTimeInput.value, eventEndInput.value)) {
        return;
      }
      events.push({ date: selectedDate, time: eventTimeInput.value, endTime: eventEndInput.value, type: eventTypeInput.value, text: text });
      eventInput.value = "";
      eventTimeInput.value = "";
      eventEndInput.value = "";
      saveEvents();
      showPlans();
    }

    // 前へ・次へ（月なら1か月、週なら1週間ずつ動く）
    function movePlan(step) {
      if (planView === "month") {
        planCursor = new Date(planCursor.getFullYear(), planCursor.getMonth() + step, 1);
      } else {
        planCursor = addDays(planCursor, step * 7);
      }
      showPlans();
    }

    document.getElementById("plan-prev").addEventListener("click", function () { movePlan(-1); });
    document.getElementById("plan-next").addEventListener("click", function () { movePlan(1); });
    document.getElementById("plan-today").addEventListener("click", function () {
      planCursor = new Date();
      selectDate(dateKey(planCursor));
    });
    viewButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        planView = button.dataset.view;
        localStorage.setItem("planView", planView);
        planCursor = parseDate(selectedDate); // 選んでいる日がふくまれる月・週を表示する
        showPlans();
      });
    });
    document.getElementById("month-goal-add-button").addEventListener("click", function () {
      addGoal(monthGoalKey(), monthGoalInput);
    });
    monthGoalInput.addEventListener("keydown", function (event) {
      if (isEnterToAdd(event)) {
        addGoal(monthGoalKey(), monthGoalInput);
      }
    });
    document.getElementById("week-goal-add-button").addEventListener("click", function () {
      addGoal(weekGoalKey(), weekGoalInput);
    });
    weekGoalInput.addEventListener("keydown", function (event) {
      if (isEnterToAdd(event)) {
        addGoal(weekGoalKey(), weekGoalInput);
      }
    });
    document.getElementById("event-add-button").addEventListener("click", addEvent);
    eventInput.addEventListener("keydown", function (event) {
      if (isEnterToAdd(event)) {
        addEvent();
      }
    });

    showPlans();

    // ============================================
    //  ページの切りかえ
    // ============================================
    const PAGES = {
      plans: { title: "Plans", section: document.getElementById("page-plans") },
      dreams: { title: "Dream List", section: document.getElementById("page-dreams") },
      habits: { title: "Habits", section: document.getElementById("page-habits") },
      diary: { title: "Diary", section: document.getElementById("page-diary") },
      media: { title: "Books & Films", section: document.getElementById("page-media") }
    };
    const tabButtons = document.querySelectorAll(".tabs button");

    function openPage(name) {
      if (!PAGES[name]) {
        name = tabButtons[0].dataset.page; // いちばん左のページ
      }
      Object.keys(PAGES).forEach(function (key) {
        PAGES[key].section.hidden = key !== name;
      });
      tabButtons.forEach(function (button) {
        button.classList.toggle("active", button.dataset.page === name);
      });
      document.getElementById("page-title").textContent = PAGES[name].title;
      document.title = PAGES[name].title;
      document.body.classList.toggle("wide", name === "plans");
      // 次に開いたとき、同じページから始まるように覚えておく
      localStorage.setItem("lastPage", name);
    }

    tabButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        openPage(button.dataset.page);
      });
    });

    openPage(localStorage.getItem("lastPage"));
  </script>

  <script>

    let stopListening = null;    // クラウドの見張りを止める関数
    let syncReady = false;       // 最初の読みこみが終わったか
    const lastUploaded = {};     // 最後に送った（または受け取った）内容。同じものを何度も送らないため
    const saveTimers = {};       // 少し待ってからまとめて送るためのタイマー
    let sending = 0;             // 送っている途中の数

    function setStatus(text) {
      syncStatus.textContent = text;
    }

    // この端末で変えたのに、まだクラウドに送れていない記録の名前（ブラウザを閉じても覚えておく）
    function dirtyKeys() {
      try {
        return JSON.parse(localStorage.getItem("syncDirty") || "[]");
      } catch (error) {
        return [];
      }
    }
    function markDirty(key, dirty) {
      const keys = dirtyKeys().filter(function (k) { return k !== key; });
      if (dirty) keys.push(key);
      localStorage.setItem("syncDirty", JSON.stringify(keys));
    }

    // ---- 記録を、クラウドに置く単位（箱）に分ける ----
    // 日記：{ "2026-10-09": "…" } を年ごとに  → diary_2026, diary_2027 …
    // 予定：[{ date: "2026-10-09", … }] を年ごとに → events_2026 …
    // そのほか：1つの箱
    function shardsOf(key, value) {
      const shards = {};
      if (key === "diary") {
        Object.keys(value).forEach(function (date) {
          const id = "diary_" + date.slice(0, 4);
          if (!shards[id]) shards[id] = {};
          shards[id][date] = value[date];
        });
      } else if (key === "events") {
        value.forEach(function (event) {
          const id = "events_" + String(event.date).slice(0, 4);
          if (!shards[id]) shards[id] = [];
          shards[id].push(event);
        });
      } else {
        shards[key] = value;
      }
      return shards;
    }

    // 箱に分けたものを、元の形にもどす
    function mergeShards(key, shards) {
      const ids = Object.keys(shards).sort();
      if (key === "diary") {
        const result = {};
        ids.forEach(function (id) { Object.assign(result, shards[id]); });
        return result;
      }
      if (key === "events") {
        let result = [];
        ids.forEach(function (id) { result = result.concat(shards[id]); });
        return result;
      }
      return shards[key];
    }

    // 箱の名前から、どの記録の箱かを調べる（diary_2026 → diary）
    function keyOfShard(id) {
      return id.split("_")[0];
    }

    // この端末に保存されている記録
    function localValue(key) {
      const fallback = (key === "diary" || key === "goals") ? "{}" : "[]";
      try {
        return JSON.parse(localStorage.getItem(key) || fallback);
      } catch (error) {
        return JSON.parse(fallback);
      }
    }

    // ---- 送る ----
    // 記録が保存されたら、少し待ってからクラウドに送る（続けて書いているときに、何度も送らないように）
    function cloudSave(key) {
      if (SYNC_KEYS.indexOf(key) === -1) {
        return;
      }
      markDirty(key, true); // 送り終わるまで「まだ送っていない」として覚えておく
      if (!currentUser || !syncReady) {
        return; // ログインしたときに送る
      }
      clearTimeout(saveTimers[key]);
      setStatus("☁️ 送信中…");
      saveTimers[key] = setTimeout(function () {
        uploadKey(key);
      }, 800);
    }

    function uploadKey(key) {
      if (!currentUser) return;
      const shards = shardsOf(key, localValue(key));
      // 前に送った箱で、今は空になったもの（例：その年の日記をぜんぶ消した）も、空にして送る
      Object.keys(lastUploaded).forEach(function (id) {
        if (keyOfShard(id) === key && !(id in shards)) {
          shards[id] = key === "diary" ? {} : [];
        }
      });
      const uploads = [];
      Object.keys(shards).forEach(function (id) {
        const json = JSON.stringify(shards[id]);
        if (lastUploaded[id] === json) {
          return; // 変わっていない箱は送らない
        }
        lastUploaded[id] = json;
        sending++;
        uploads.push(dataCollection.doc(id).set({
          value: json,
          device: deviceId,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function () {
          sending--;
          if (sending === 0) setStatus("☁️ 同期済み（" + currentUser.email + "）");
        }).catch(function (error) {
          sending--;
          delete lastUploaded[id]; // 次の保存のときに、もう一度送る
          console.error(error);
          setStatus("⚠️ 送信できませんでした。ネットにつながっているか確認してください");
          throw error;
        }));
      });
      // ぜんぶ送れたら「まだ送っていない」の印を消す
      Promise.all(uploads).then(function () {
        markDirty(key, false);
      }).catch(function () {});
      if (sending === 0) setStatus("☁️ 同期済み（" + currentUser.email + "）");
    }

    // ---- 受け取る ----
    // クラウドから届いた記録を、この端末に反映して表示しなおす
    function applyData(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
      if (key === "dreams") {
        dreams = value;
        editingDream = null;
        show();
      } else if (key === "habits") {
        habits = value;
        editingHabit = null;
        showHabits();
      } else if (key === "diary") {
        diary = value;
        showDiaryList();
        // 今まさに日記を書いているときは、書いている文字を上書きしない
        if (document.activeElement !== diaryText && !diaryTimer) {
          diaryText.value = diary[diaryDate] || "";
        }
      } else if (key === "media") {
        mediaItems = migrateMedia(value);
        editingMedia = null;
        showMedia();
      } else if (key === "events") {
        events = value;
        editingEvent = null;
        showPlans();
      } else if (key === "goals") {
        goals = value;
        showGoals();
      }
    }

    // クラウドの見張りを始める（ほかの端末で変わると、ここが呼ばれる）
    function startListening() {
      let first = true;
      stopListening = dataCollection.onSnapshot(function (snapshot) {
        if (first) {
          first = false;
          firstSync(snapshot);
          return;
        }
        // ほかの端末で変わった箱だけを取り出す
        const changed = {};
        snapshot.docChanges().forEach(function (change) {
          if (change.type === "removed") return;
          const data = change.doc.data();
          if (data.device === deviceId) return; // 自分が送ったものは無視
          const key = keyOfShard(change.doc.id);
          if (SYNC_KEYS.indexOf(key) === -1) return;
          if (!changed[key]) changed[key] = {};
          changed[key][change.doc.id] = data.value;
        });
        Object.keys(changed).forEach(function (key) {
          // この端末の内容をもとに、変わった箱だけを入れかえる
          const shards = shardsOf(key, localValue(key));
          Object.keys(changed[key]).forEach(function (id) {
            shards[id] = JSON.parse(changed[key][id]);
            lastUploaded[id] = changed[key][id];
          });
          const merged = mergeShards(key, shards);
          if (JSON.stringify(merged) !== JSON.stringify(localValue(key))) {
            applyData(key, merged);
          }
        });
        if (sending === 0) setStatus("☁️ 同期済み（" + currentUser.email + "）");
      }, function (error) {
        console.error(error);
        setStatus("⚠️ クラウドを読めませんでした（" + error.code + "）");
      });
    }

    // ログインして最初の読みこみ
    function firstSync(snapshot) {
      const cloud = {}; // 記録の名前 → { 箱の名前: 内容 }
      snapshot.docs.forEach(function (doc) {
        const key = keyOfShard(doc.id);
        if (SYNC_KEYS.indexOf(key) === -1) return;
        if (!cloud[key]) cloud[key] = {};
        cloud[key][doc.id] = JSON.parse(doc.data().value);
        lastUploaded[doc.id] = doc.data().value;
      });

      const firstTimeOnThisDevice = localStorage.getItem("syncedUser") !== currentUser.uid;
      if (firstTimeOnThisDevice && Object.keys(cloud).length > 0) {
        // この端末ではじめての同期で、クラウドにすでに記録があるとき：
        // クラウドの記録を使う（念のため、この端末の記録は控えとして残しておく）
        const backup = {};
        SYNC_KEYS.forEach(function (key) { backup[key] = localValue(key); });
        localStorage.setItem("before-sync-backup", JSON.stringify(backup));
      }

      syncReady = true;
      const dirty = firstTimeOnThisDevice ? [] : dirtyKeys();
      SYNC_KEYS.forEach(function (key) {
        if (cloud[key] && dirty.indexOf(key) === -1) {
          // この端末にまだ送っていない変更がなければ、クラウドの新しい内容にそろえる
          const merged = mergeShards(key, cloud[key]);
          if (JSON.stringify(merged) !== JSON.stringify(localValue(key))) {
            applyData(key, merged);
          }
          markDirty(key, false);
        } else {
          // クラウドにまだない記録や、この端末で変えてまだ送っていない記録は、この端末の内容を送る
          uploadKey(key);
        }
      });
      localStorage.setItem("syncedUser", currentUser.uid);
      if (sending === 0) setStatus("☁️ 同期済み（" + currentUser.email + "）");
    }

    // ---- ログイン・ログアウト ----
    function setupSync() {
      // パソコンのファイルを直接開いているとき（file://）は、ログインできない
      if (location.protocol !== "https:" && location.hostname !== "localhost") {
        setStatus("☁️ 同期は https://tomo-notebook.github.io/my-life-notebook/ で開くと使えます");
        return;
      }
      if (typeof firebase === "undefined") {
        setStatus("⚠️ ネットにつながっていないため、同期を準備できませんでした（この端末には保存されます）");
        return;
      }

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      // 電波がないときに書いた内容も、つながったときに送れるようにする
      db.enablePersistence({ synchronizeTabs: true }).catch(function () {});

      loginButton.addEventListener("click", function () {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider).catch(function (error) {
          if (error.code === "auth/popup-blocked" || error.code === "auth/operation-not-supported-in-this-environment") {
            // 別の窓が開けないときは、ページごと移動してログインする
            firebase.auth().signInWithRedirect(provider);
          } else if (error.code === "auth/unauthorized-domain") {
            alert("このアドレスはログインが許可されていません。Firebase の「承認済みドメイン」に " + location.hostname + " を追加してください。");
          } else if (error.code !== "auth/popup-closed-by-user" && error.code !== "auth/cancelled-popup-request") {
            alert("ログインできませんでした（" + error.code + "）");
          }
        });
      });

      logoutButton.addEventListener("click", function () {
        if (confirm("ログアウトしますか？（この端末の記録は残りますが、同期は止まります）")) {
          firebase.auth().signOut();
        }
      });

      firebase.auth().onAuthStateChanged(function (user) {
        if (stopListening) {
          stopListening();
          stopListening = null;
        }
        currentUser = user;
        syncReady = false;
        Object.keys(lastUploaded).forEach(function (id) { delete lastUploaded[id]; });
        loginButton.hidden = Boolean(user);
        logoutButton.hidden = !user;
        if (!user) {
          setStatus("☁️ ログインすると、PC とスマホで同期できます");
          return;
        }
        setStatus("☁️ 同期を準備中…");
        dataCollection = db.collection("users").doc(user.uid).collection("data");
        startListening();
      });
    }

    window.addEventListener("offline", function () {
      if (currentUser) setStatus("📴 オフライン（つながったら自動で送ります）");
    });
    window.addEventListener("online", function () {
      if (currentUser) setStatus("☁️ 同期済み（" + currentUser.email + "）");
    });

    setupSync();
  </script>
</body>
</html>

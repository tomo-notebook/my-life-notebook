<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notebook">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f4f1ec">
  <title>Dream List</title>
  <style>
    /* 色の設定（ここを変えると、アプリ全体の色が変わります） */
    :root {
      --background: #f4f1ec;  /* 背景 */
      --card: #fffdf9;        /* 夢のカード */
      --text: #2b2926;        /* 文字 */
      --sub-text: #8c857b;    /* 薄い文字 */
      --line: #e2dcd2;        /* 線 */
      --accent: #a8875a;      /* アクセント（金色） */
      --danger: #a9574d;      /* 削除・期限切れ */
    }
    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      font-weight: 300;
      background: var(--background);
      color: var(--text);
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px;
      letter-spacing: 0.04em;
      line-height: 1.7;
    }
    /* タイトル */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    .subtitle {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 0.2em;
      margin: 0;
    }
    h1 {
      font-family: Didot, "Bodoni 72", Georgia, serif;
      font-weight: 400;
      font-size: 34px;
      letter-spacing: 0.12em;
      margin: 8px 0 0;
    }
    header::after {
      content: "";
      display: block;
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin: 20px auto 0;
    }
    /* ページ切りかえボタン */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: -16px 0 36px;
    }
    .tabs button {
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      padding: 4px 2px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      color: var(--sub-text);
    }
    .tabs button:hover {
      color: var(--text);
    }
    .tabs button.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    /* 星の評価 */
    .stars button {
      background: none;
      border: none;
      padding: 0 1px;
      font-size: 15px;
      color: var(--line);
      letter-spacing: 0;
    }
    .stars {
      display: inline-flex;
      white-space: nowrap;
    }
    .stars button.on {
      color: var(--accent);
    }
    /* 本・映画の記録を書く欄 */
    .log-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 32px;
    }
    .log-form .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .log-form input[type="text"] {
      flex: 1;
      min-width: 200px;
    }
    .log-form .stars button {
      font-size: 20px;
    }
    .log-form .spacer {
      flex: 1;
    }
    .log-form #media-add-button {
      padding: 10px 24px;
      font-size: 14px;
      background: var(--text);
      color: var(--card);
      border: none;
      border-radius: 2px;
    }
    .log-form #media-add-button:hover {
      background: var(--accent);
    }
    /* 習慣トラッカーの表 */
    .table-scroll {
      overflow-x: auto; /* 画面がせまいときは横にスクロール */
    }
    .habit-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .habit-table th,
    .habit-table td {
      border-bottom: 1px solid var(--line);
      padding: 10px 4px;
      text-align: center;
      white-space: nowrap;
    }
    .habit-table thead th {
      border-top: 1px solid var(--line);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 12px;
      color: var(--sub-text);
      line-height: 1.4;
    }
    .habit-table .habit-name {
      text-align: left;
      white-space: normal;
      min-width: 6em;
    }
    .habit-table .today {
      background: rgba(168, 135, 90, 0.08); /* 今日の列をうっすら色づけ */
    }
    .habit-table thead .today {
      color: var(--accent);
    }
    .habit-dot {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: none;
    }
    .habit-dot:hover {
      border-color: var(--accent);
    }
    .habit-dot.on {
      background: var(--accent);
      border-color: var(--accent);
    }
    .habit-streak {
      font-size: 13px;
      color: var(--accent);
    }
    .habit-total {
      font-size: 13px;
      color: var(--sub-text);
    }
    .habit-actions {
      text-align: right;
    }
    .habit-name input {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
    }
    /* 前の週・次の週 */
    .week-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
    }
    .week-nav button {
      background: none;
      border: none;
      font-size: 13px;
      color: var(--sub-text);
    }
    .week-nav button:hover:not(:disabled) {
      color: var(--accent);
    }
    .week-nav button:disabled {
      opacity: 0.3;
      cursor: default;
    }
    /* 日記 */
    .diary-date {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .diary-date h2 {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.1em;
      margin: 0;
    }
    .diary-date input[type="date"] {
      padding: 4px 8px;
      font-size: 13px;
    }
    /* ===== Plans（予定と目標） ===== */
    .plan-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }
    .plan-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .plan-nav h2 {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.08em;
      margin: 0 4px;
      min-width: 8em;
      text-align: center;
    }
    .plan-nav button,
    .view-switch button {
      background: none;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 4px 12px;
      font-size: 13px;
      color: var(--sub-text);
    }
    .plan-nav button:hover,
    .view-switch button:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .view-switch {
      display: flex;
    }
    .view-switch button.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--card);
    }
    /* 目標 */
    .goal-box {
      margin-bottom: 28px;
    }
    .goal-box h3,
    .day-panel h3 {
      font-family: Georgia, "Hiragino Mincho ProN", serif;
      font-weight: 400;
      font-size: 15px;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin: 0 0 6px;
    }
    .goal-box ul {
      border-top: none;
    }
    .goal-box li {
      padding: 6px 4px;
      border-bottom: 1px dashed var(--line);
    }
    .goal-box li.done span {
      text-decoration: line-through;
      text-decoration-color: var(--accent);
      color: var(--sub-text);
    }
    .small-form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .small-form input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      font-size: 14px;
    }
    .small-form input[type="time"] {
      font-family: inherit;
      font-size: 14px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--card);
      color: var(--text);
    }
    .small-form button {
      padding: 6px 16px;
      font-size: 13px;
      background: var(--text);
      color: var(--card);
      border: none;
      border-radius: 2px;
    }
    .small-form button:hover {
      background: var(--accent);
    }
    /* 月のカレンダー */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }
    .cal-weekday {
      text-align: center;
      font-size: 12px;
      color: var(--sub-text);
      padding: 6px 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .cal-cell {
      min-height: 84px;
      padding: 4px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--card);
      cursor: pointer;
      overflow: hidden;
    }
    .cal-cell:hover {
      background: rgba(168, 135, 90, 0.06);
    }
    .cal-cell.other-month {
      background: none;
      color: var(--sub-text);
      opacity: 0.5;
    }
    .cal-cell.selected {
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .cal-day {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
    }
    .cal-cell.today .cal-day {
      display: inline-block;
      min-width: 1.6em;
      text-align: center;
      background: var(--accent);
      color: var(--card);
      border-radius: 999px;
    }
    .cal-event {
      border-left: 3px solid var(--sub-text);
      padding-left: 3px;
      margin-top: 1px;
      font-size: 11px;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-more {
      font-size: 11px;
      color: var(--sub-text);
    }
    .sun {
      color: var(--danger);
    }
    .sat {
      color: #5a7a9a;
    }
    /* 週の一覧 */
    .week-list {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid var(--line);
    }
    .week-list li {
      align-items: flex-start;
      cursor: pointer;
      padding: 12px 4px;
    }
    .week-list li:hover {
      background: rgba(168, 135, 90, 0.06);
    }
    .week-list li.selected {
      background: rgba(168, 135, 90, 0.12);
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .week-list .week-day {
      width: 6em;
      font-size: 14px;
      font-family: Georgia, "Hiragino Mincho ProN", serif;
    }
    .week-list li.today .week-day {
      color: var(--accent);
    }
    .week-events {
      flex: 1;
      font-size: 14px;
    }
    .week-events div + div {
      margin-top: 2px;
    }
    .event-time {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--sub-text);
      margin-right: 6px;
    }
    /* 選んだ日の時間の枠 */
    .day-timeline {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .day-timeline th,
    .day-timeline td {
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .day-timeline th {
      width: 64px;
      padding: 8px 10px 8px 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 12px;
      color: var(--sub-text);
      text-align: right;
      white-space: nowrap;
    }
    .day-timeline td {
      padding: 4px 6px;
      height: 28px;
      border-left: 1px solid var(--line);
      cursor: pointer;
    }
    .day-timeline td:hover {
      background: rgba(168, 135, 90, 0.06);
    }
    .day-timeline tr.all-day th,
    .day-timeline tr.all-day td {
      border-bottom: 2px solid var(--line);
    }
    .day-timeline ul {
      border-top: none;
    }
    .day-timeline li {
      padding: 2px 0;
      border-bottom: none;
      cursor: default;
    }
    /* 1日の時間の使い方（円グラフ） */
    .day-chart {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 24px;
      margin: 8px 0 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .day-chart svg {
      flex: none;
    }
    .day-chart circle.slice {
      cursor: default;
      transition: opacity 0.15s;
    }
    .day-chart svg:hover circle.slice {
      opacity: 0.35;
    }
    .day-chart svg:hover circle.slice:hover {
      opacity: 1;
    }
    .chart-center-label {
      font-size: 11px;
      fill: var(--sub-text);
    }
    .chart-center-value {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      fill: var(--text);
    }
    .chart-legend {
      flex: 1;
      min-width: 220px;
      border-collapse: collapse;
      font-size: 13px;
    }
    .chart-legend td {
      padding: 3px 6px;
      border-bottom: 1px dashed var(--line);
      white-space: nowrap;
    }
    .chart-legend td.num {
      text-align: right;
      font-family: Georgia, "Times New Roman", serif;
    }
    .chart-legend td.percent {
      text-align: right;
      color: var(--sub-text);
      width: 3.5em;
    }
    .chart-legend tr.untracked td {
      color: var(--sub-text);
    }
    .chart-check {
      flex-basis: 100%;
      font-size: 13px;
      background: var(--background);
      padding: 10px 12px;
      line-height: 1.8;
    }
    .chart-check strong {
      font-weight: 400;
      color: var(--accent);
      margin-right: 6px;
    }
    .gap-button {
      background: none;
      border: none;
      border-bottom: 1px dashed var(--accent);
      padding: 0 2px;
      margin-right: 8px;
      font-size: 13px;
      color: var(--text);
    }
    .gap-button:hover {
      color: var(--accent);
    }
    .chart-note {
      flex-basis: 100%;
      font-size: 11px;
      color: var(--sub-text);
      margin: 0;
    }
    .chart-tip {
      position: fixed;
      pointer-events: none;
      background: var(--text);
      color: var(--card);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 2px;
      white-space: nowrap;
      z-index: 10;
    }
    /* 予定の種類の色の丸 */
    .type-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .type-tag {
      font-size: 11px;
      padding: 0 8px;
      border: 1px solid;
      border-radius: 2px;
      white-space: nowrap;
      letter-spacing: 0.1em;
    }
    .continued {
      font-size: 12px;
      color: var(--sub-text);
      border-left: 2px solid var(--accent);
      padding-left: 6px;
      opacity: 0.6;
    }
    .time-separator {
      color: var(--sub-text);
      align-self: center;
    }
    .add-event-form {
      margin: 0 0 16px;
    }
    .slot-form {
      margin-top: 2px;
    }
    .slot-form {
      flex-wrap: wrap;
    }
    .slot-form select,
    .slot-form input[type="time"] {
      padding: 4px 6px;
      font-size: 13px;
    }
    .slot-form .slot-input {
      flex: 1;
      min-width: 140px;
      width: auto;
    }
    .slot-form .cancel-button {
      background: none;
      color: var(--sub-text);
      border: 1px solid var(--line);
    }
    .slot-input {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 8px !important;
      font-size: 14px !important;
    }
    /* Plans のページだけ、画面を広く使う */
    body.wide {
      max-width: 960px;
    }
    /* 選んだ日の予定 */
    .day-panel {
      margin-top: 24px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
    }
    .day-panel ul {
      border-top: none;
    }
    .day-panel li {
      padding: 8px 0;
    }
    .day-panel .empty-message {
      padding: 4px 0;
      text-align: left;
    }
    /* 同期のバー */
    .sync-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin: -24px 0 24px;
      font-size: 12px;
      color: var(--sub-text);
    }
    .sync-bar button {
      background: none;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--sub-text);
    }
    .sync-bar button:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    #login-button {
      background: var(--text);
      border-color: var(--text);
      color: var(--card);
    }
    #login-button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--card);
    }
    /* 「隠す」と決めたものは、必ず隠す */
    [hidden] {
      display: none !important;
    }
    /* 日記のページの習慣 */
    .diary-habits {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--sub-text);
    }
    .diary-habits .label {
      margin-right: 4px;
    }
    .habit-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      font-size: 13px;
      color: var(--sub-text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .habit-chip::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid var(--line);
    }
    .habit-chip:hover {
      border-color: var(--accent);
    }
    .habit-chip.on {
      color: var(--text);
      border-color: var(--accent);
    }
    .habit-chip.on::before {
      background: var(--accent);
      border-color: var(--accent);
    }
    #diary-text {
      width: 100%;
      box-sizing: border-box;
      min-height: 220px;
      font-size: 16px;
      line-height: 2;
      padding: 16px;
      resize: vertical;
      /* 罫線のある手帳のような背景 */
      background-image: linear-gradient(transparent calc(2em - 1px), var(--line) 1px);
      background-size: 100% 2em;
      background-position: 0 16px;
      background-attachment: local;
    }
    .diary-status {
      text-align: right;
      font-size: 12px;
      color: var(--sub-text);
      min-height: 1.5em;
      margin-bottom: 24px;
    }
    .diary-entry {
      cursor: pointer;
      align-items: baseline;
    }
    .diary-entry:hover span {
      color: var(--accent);
    }
    .diary-entry.current {
      background: rgba(168, 135, 90, 0.08);
    }
    .diary-entry span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      color: var(--sub-text);
      font-size: 14px;
    }
    .diary-entry .log-date {
      width: 5em;
    }
    /* 月ごとの見出し */
    .month-heading {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 15px;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin: 28px 0 6px;
    }
    /* 読んだ日・観た日 */
    .log-date {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      color: var(--sub-text);
      width: 3em;
    }
    /* 入力欄・選ぶ欄 共通 */
    input[type="text"],
    input[type="date"],
    select,
    textarea {
      font-family: inherit;
      font-weight: 300;
      font-size: 15px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 10px 12px;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
    }
    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    button {
      font-family: inherit;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
    /* 入力欄と追加ボタン */
    .input-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 32px;
    }
    .input-area input[type="text"] {
      flex: 1;
      min-width: 200px;
    }
    .input-area button {
      padding: 10px 24px;
      font-size: 14px;
      background: var(--text);
      color: var(--card);
      border: none;
      border-radius: 2px;
    }
    .input-area button:hover {
      background: var(--accent);
    }
    /* かなった夢の数 */
    .summary {
      text-align: center;
      font-size: 14px;
      color: var(--sub-text);
      margin-bottom: 28px;
    }
    .progress {
      height: 2px;
      background: var(--line);
      margin: 10px auto 0;
      max-width: 320px;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s;
    }
    /* ジャンルの絞り込みと並び順 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 16px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--sub-text);
      align-items: center;
    }
    .controls select {
      padding: 4px 8px;
      font-size: 13px;
    }
    /* 夢の一覧 */
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid var(--line);
    }
    li {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 16px 4px;
      border-bottom: 1px solid var(--line);
    }
    li span {
      flex: 1;
      font-size: 16px;
    }
    /* ジャンルの札 */
    .genre-tag {
      font-size: 11px;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0 8px;
      border-radius: 2px;
      white-space: nowrap;
      letter-spacing: 0.1em;
    }
    /* 目標の日付 */
    .dream-date {
      font-size: 12px;
      color: var(--sub-text);
      white-space: nowrap;
    }
    .dream-date.over {
      color: var(--danger);
    }
    /* かなった夢は線を引いて薄くする */
    li.done span {
      text-decoration: line-through;
      text-decoration-color: var(--accent);
      color: var(--sub-text);
    }
    li.done .genre-tag {
      opacity: 0.5;
    }
    .delete-button,
    .edit-button {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: var(--sub-text);
    }
    .edit-button:hover {
      color: var(--accent);
    }
    .delete-button:hover {
      color: var(--danger);
    }
    /* メモ（夢の下に表示する） */
    .memo {
      flex-basis: 100%;
      font-size: 13px;
      color: var(--sub-text);
      padding-left: 12px;
      margin-left: 28px;
      border-left: 1px solid var(--accent);
      white-space: pre-wrap; /* 改行をそのまま表示する */
    }
    /* 書き直し用の入力欄 */
    .edit-form {
      flex-basis: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .edit-form .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .edit-form button {
      padding: 8px 20px;
      font-size: 13px;
      border-radius: 2px;
    }
    .save-button {
      background: var(--text);
      color: var(--card);
      border: 1px solid var(--text);
    }
    .cancel-button {
      background: none;
      color: var(--sub-text);
      border: 1px solid var(--line);
    }
    .empty-message {
      text-align: center;
      color: var(--sub-text);
      font-size: 14px;
      padding: 32px 0;
    }
    /* バックアップ */
    .backup {
      margin-top: 56px;
      text-align: center;
      font-size: 12px;
      color: var(--sub-text);
    }
    .backup p {
      margin: 0 0 8px;
      letter-spacing: 0.15em;
    }
    .backup button {
      padding: 6px 16px;
      font-size: 12px;
      margin: 4px;
      background: none;
      color: var(--sub-text);
      border: 1px solid var(--line);
      border-radius: 2px;
    }
    .backup button:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    /* ============================================
       スマホなど、画面がせまいとき（幅 600px 以下）
       ============================================ */
    @media (max-width: 600px) {
      body {
        padding: 20px 14px 40px;
        /* iPhone の画面の上下（ノッチなど）に重ならないように */
        padding-top: calc(20px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
      }
      /* ページの切りかえボタンは、横にスクロールできる1列に */
      .tabs {
        justify-content: flex-start;
        gap: 20px;
        margin: -8px -14px 24px;
        padding: 0 14px;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
      }
      .sync-bar {
        margin: -12px 0 16px;
        justify-content: flex-start;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tabs button {
        flex: none;
        padding: 8px 2px;
      }
      /* 文字を入れるとき、iPhone が勝手に拡大しないように 16px にする */
      input[type="text"],
      input[type="date"],
      input[type="time"],
      select,
      textarea,
      .small-form input[type="text"],
      .small-form input[type="time"],
      .slot-form select,
      .slot-form input[type="time"],
      .controls select {
        font-size: 16px !important;
      }
      .input-area input[type="text"],
      .log-form input[type="text"] {
        min-width: 100%;
      }
      .input-area button {
        flex: 1;
      }
      /* 指で押しやすいように、小さいボタンを少し大きく */
      .edit-button,
      .delete-button {
        padding: 6px 4px;
        font-size: 13px;
      }
      .controls {
        justify-content: flex-start;
      }
      /* 予定を追加する欄は、2段に折り返す */
      .add-event-form {
        flex-wrap: wrap;
      }
      .add-event-form input[type="text"] {
        flex-basis: 100%;
        order: 5;
      }
      .add-event-form button {
        order: 6;
        flex: 1;
        padding: 10px;
      }
      .add-event-form select {
        flex: 1;
      }
      /* Plans の上のボタン */
      .plan-toolbar {
        gap: 10px;
      }
      .plan-nav h2 {
        font-size: 17px;
        min-width: 0;
      }
      .plan-nav button,
      .view-switch button {
        padding: 6px 12px;
      }
      /* 月のカレンダーは、マスを小さく */
      .cal-cell {
        min-height: 60px;
        padding: 2px;
      }
      .cal-event {
        font-size: 10px;
      }
      /* 週の一覧 */
      .week-list .week-day {
        width: 5.5em;
      }
      /* 円グラフと一覧は縦に並べる */
      .day-chart {
        justify-content: center;
      }
      .chart-legend {
        min-width: 100%;
      }
      .day-panel {
        padding: 12px;
        margin-left: -4px;
        margin-right: -4px;
      }
      .day-timeline th {
        width: 48px;
        padding-right: 6px;
      }
      /* 日記 */
      #diary-text {
        min-height: 180px;
      }
      /* 本・映画 */
      .log-form .stars button {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <p class="subtitle">Notebook</p>
    <h1 id="page-title">Dream List</h1>
  </header>

  <nav class="tabs">
    <button data-page="plans">Plans</button>
    <button data-page="diary">Diary</button>
    <button data-page="dreams">Dreams</button>
    <button data-page="habits">Habits</button>
    <button data-page="media">Books &amp; Films</button>
  </nav>

  <div id="sync-bar" class="sync-bar">
    <span id="sync-status"></span>
    <button id="login-button" hidden>Google でログインして同期</button>
    <button id="logout-button" hidden>ログアウト</button>
  </div>

  <!-- ===== 夢リストのページ ===== -->
  <section id="page-dreams">

  <div class="input-area">
    <input id="dream-input" type="text" placeholder="夢を書いてください（例：富士山に登る）">
    <select id="genre-input" title="ジャンル">
      <option value="旅行">旅行</option>
      <option value="仕事">仕事</option>
      <option value="趣味">趣味</option>
      <option value="学び">学び</option>
      <option value="健康">健康</option>
      <option value="その他" selected>その他</option>
    </select>
    <input id="date-input" type="date" title="目標の日付（なくても大丈夫）">
    <button id="add-button">追加</button>
  </div>

  <div class="summary">
    <div id="summary-text"></div>
    <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
  </div>

  <div class="controls">
    <label>ジャンル：
      <select id="genre-filter">
        <option value="すべて">すべて</option>
        <option value="旅行">旅行</option>
        <option value="仕事">仕事</option>
        <option value="趣味">趣味</option>
        <option value="学び">学び</option>
        <option value="健康">健康</option>
        <option value="その他">その他</option>
      </select>
    </label>
    <label>並び順：
      <select id="sort-order">
        <option value="added">追加した順</option>
        <option value="date">日付が近い順</option>
      </select>
    </label>
  </div>

  <p id="empty-message" class="empty-message">まだ夢がありません。上に書いてみましょう！</p>
  <ul id="dream-list"></ul>
  </section>

  <!-- ===== 習慣トラッカーのページ ===== -->
  <section id="page-habits" hidden>
  <div class="input-area">
    <input id="habit-input" type="text" placeholder="続けたい習慣（例：早起き、読書 15分）">
    <button id="habit-add-button">追加</button>
  </div>

  <p id="habit-empty-message" class="empty-message">続けたい習慣を追加してみましょう！</p>
  <div class="table-scroll">
    <table class="habit-table">
      <thead id="habit-head"></thead>
      <tbody id="habit-body"></tbody>
    </table>
  </div>
  <div class="week-nav">
    <button id="prev-week">‹ 前の週</button>
    <button id="next-week">次の週 ›</button>
  </div>
  </section>

  <!-- ===== 予定と目標のページ ===== -->
  <section id="page-plans" hidden>
  <div class="plan-toolbar">
    <div class="plan-nav">
      <button id="plan-prev" title="前へ">‹</button>
      <h2 id="plan-heading"></h2>
      <button id="plan-next" title="次へ">›</button>
      <button id="plan-today">今日</button>
    </div>
    <div class="view-switch">
      <button data-view="month">月</button>
      <button data-view="week">週</button>
    </div>
  </div>

  <div class="goal-box">
    <h3 id="month-goal-heading"></h3>
    <ul id="month-goal-list"></ul>
    <div class="small-form">
      <input id="month-goal-input" type="text" placeholder="月の目標を追加">
      <button id="month-goal-add-button">追加</button>
    </div>
  </div>

  <div id="week-goal-box" class="goal-box">
    <h3>この週の目標</h3>
    <ul id="week-goal-list"></ul>
    <div class="small-form">
      <input id="week-goal-input" type="text" placeholder="週の目標を追加">
      <button id="week-goal-add-button">追加</button>
    </div>
  </div>

  <div id="month-view" class="table-scroll"></div>
  <ul id="week-view" class="week-list"></ul>

  <div class="day-panel">
    <h3 id="day-heading"></h3>
    <div id="day-chart" class="day-chart"></div>
    <div class="small-form add-event-form">
      <input id="event-time-input" type="time" title="開始時間（なくても大丈夫）">
      <span class="time-separator">〜</span>
      <input id="event-end-input" type="time" title="終了時間（なくても大丈夫）">
      <select id="event-type-input" title="予定の種類"></select>
      <input id="event-input" type="text" placeholder="予定を追加（例：歯医者）">
      <button id="event-add-button">追加</button>
    </div>
    <p id="day-empty-message" class="empty-message">予定はありません</p>
    <ul id="day-events"></ul>
    <table id="day-timeline" class="day-timeline"></table>
  </div>
  </section>

  <!-- ===== 日記のページ ===== -->
  <section id="page-diary" hidden>
  <div class="diary-date">
    <h2 id="diary-heading"></h2>
    <label class="controls" style="margin: 0;">日付を選ぶ：
      <input id="diary-date-input" type="date">
    </label>
  </div>
  <div id="diary-habits" class="diary-habits"></div>
  <textarea id="diary-text" placeholder="今日はどんな一日でしたか？"></textarea>
  <div id="diary-status" class="diary-status"></div>

  <p id="diary-empty-message" class="empty-message">書いた日記は、ここに並びます。</p>
  <div id="diary-list"></div>
  </section>

  <!-- ===== 本・映画の記録のページ ===== -->
  <section id="page-media" hidden>
  <div class="log-form">
    <div class="row">
      <input id="media-input" type="text" placeholder="タイトル（例：星の王子さま）">
      <select id="media-type-input" title="種類">
        <option value="本">本</option>
        <option value="映画">映画</option>
      </select>
      <input id="media-date-input" type="date" title="読んだ日・観た日">
    </div>
    <textarea id="media-memo-input" rows="2" placeholder="感想・メモ（なくても大丈夫）"></textarea>
    <div class="row">
      <div id="media-rating-input" class="stars" title="評価"></div>
      <span class="spacer"></span>
      <button id="media-add-button">記録する</button>
    </div>
  </div>

  <div class="summary">
    <div id="media-summary-text"></div>
  </div>

  <div class="controls">
    <label>種類：
      <select id="media-type-filter">
        <option value="すべて">すべて</option>
        <option value="本">本</option>
        <option value="映画">映画</option>
      </select>
    </label>
  </div>

  <p id="media-empty-message" class="empty-message"></p>
  <div id="media-list"></div>
  </section>

  <div class="backup">
    <p>手帳のバックアップ</p>
    <button id="export-button">ファイルに書き出す</button>
    <button id="import-button">ファイルから読み込む</button>
    <input id="import-file" type="file" accept=".json" hidden>
  </div>

  <script>
    // 記録を保存したことを、同期のしくみに知らせる（同期のしくみがまだ準備できていなければ何もしない）
    function notifySaved(key) {
      if (typeof cloudSave === "function") {
        cloudSave(key);
      }
    }

    // ブラウザに保存するときの名前
    const STORAGE_KEY = "dreams";

    // 「追加するためのEnter」かどうかを調べる
    // （日本語の変換を確定するためのEnterでは追加しない。
    //   Safari では変換確定のEnterが keyCode 229 になるので、それも見分ける）
    function isEnterToAdd(event) {
      return event.key === "Enter" && !event.isComposing && event.keyCode !== 229;
    }

    // 保存されている夢を読み込む（なければ空のリスト）
    let dreams = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    const input = document.getElementById("dream-input");
    const dateInput = document.getElementById("date-input");
    const genreInput = document.getElementById("genre-input");
    const addButton = document.getElementById("add-button");
    const list = document.getElementById("dream-list");
    const emptyMessage = document.getElementById("empty-message");
    const summaryText = document.getElementById("summary-text");
    const progressBar = document.getElementById("progress-bar");
    const genreFilter = document.getElementById("genre-filter");
    const sortOrder = document.getElementById("sort-order");

    // 選べるジャンルの一覧
    const GENRES = ["旅行", "仕事", "趣味", "学び", "健康", "その他"];

    // いま書き直している夢（書き直していないときは null）
    let editingDream = null;

    // ジャンルがない夢（前に追加したもの）は「その他」として扱う
    function genreOf(dream) {
      return dream.genre || "その他";
    }

    // 「5個の夢のうち、2個かなった！」を表示する
    function showSummary() {
      const total = dreams.length;
      const doneCount = dreams.filter(function (dream) { return dream.done; }).length;
      if (total === 0) {
        summaryText.textContent = "夢を追加すると、ここに数が表示されます";
        progressBar.style.width = "0%";
        return;
      }
      summaryText.textContent = total + "個の夢のうち、" + doneCount + "個がかないました。" +
        (doneCount === total ? " すべての夢がかないました。" : "");
      progressBar.style.width = (doneCount / total * 100) + "%";
    }

    // 表示する夢を選んで、並べ替える
    function dreamsToShow() {
      let result = dreams.filter(function (dream) {
        return genreFilter.value === "すべて" || genreOf(dream) === genreFilter.value;
      });
      if (sortOrder.value === "date") {
        // 日付が近い順に並べる（日付がない夢はいちばん下）
        result = result.slice().sort(function (a, b) {
          if (!a.date && !b.date) return 0;
          if (!a.date) return 1;
          if (!b.date) return -1;
          return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
        });
      }
      return result;
    }

    // 夢のリストをブラウザに保存する
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dreams));
      notifySaved("dreams");
    }

    // 画面に夢のリストを表示する
    function show() {
      list.innerHTML = "";
      showSummary();

      const visible = dreamsToShow();
      if (dreams.length === 0) {
        emptyMessage.textContent = "まだ夢がありません。上に書いてみましょう！";
      } else {
        emptyMessage.textContent = "このジャンルの夢はまだありません。";
      }
      emptyMessage.hidden = visible.length > 0;

      visible.forEach(function (dream) {
        // 書き直し中の夢は、入力欄を表示する
        if (dream === editingDream) {
          list.appendChild(makeEditForm(dream));
          return;
        }

        const li = document.createElement("li");
        if (dream.done) {
          li.classList.add("done");
        }

        // かなったらチェックを入れる
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = dream.done;
        checkbox.addEventListener("change", function () {
          dream.done = checkbox.checked;
          save();
          show();
        });

        // 夢の文章
        const text = document.createElement("span");
        text.textContent = dream.text;

        // ジャンルの札
        const genreTag = document.createElement("small");
        genreTag.className = "genre-tag";
        genreTag.textContent = genreOf(dream);

        // 目標の日付（書いてある場合だけ表示する）
        const dateText = document.createElement("small");
        dateText.className = "dream-date";
        if (dream.date) {
          dateText.textContent = makeDateText(dream.date, dream.done);
          if (!dream.done && daysLeft(dream.date) < 0) {
            dateText.classList.add("over"); // 日付を過ぎていたら赤くする
          }
        }

        // 編集ボタン
        const editButton = document.createElement("button");
        editButton.textContent = "編集";
        editButton.className = "edit-button";
        editButton.addEventListener("click", function () {
          editingDream = dream;
          show();
        });

        // 削除ボタン
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除";
        deleteButton.className = "delete-button";
        deleteButton.addEventListener("click", function () {
          dreams.splice(dreams.indexOf(dream), 1);
          save();
          show();
        });

        li.appendChild(checkbox);
        li.appendChild(genreTag);
        li.appendChild(text);
        li.appendChild(dateText);
        li.appendChild(editButton);
        li.appendChild(deleteButton);

        // メモ（書いてある場合だけ表示する）
        if (dream.memo) {
          const memo = document.createElement("div");
          memo.className = "memo";
          memo.textContent = dream.memo;
          li.appendChild(memo);
        }

        list.appendChild(li);
      });
    }

    // 夢を書き直すための入力欄を作る
    function makeEditForm(dream) {
      const li = document.createElement("li");
      const form = document.createElement("div");
      form.className = "edit-form";

      // 夢の文章
      const textInput = document.createElement("input");
      textInput.type = "text";
      textInput.value = dream.text;

      // ジャンルと日付（横に並べる）
      const row = document.createElement("div");
      row.className = "row";
      const genreSelect = document.createElement("select");
      GENRES.forEach(function (genre) {
        const option = document.createElement("option");
        option.value = genre;
        option.textContent = genre;
        genreSelect.appendChild(option);
      });
      genreSelect.value = genreOf(dream);
      const dateEdit = document.createElement("input");
      dateEdit.type = "date";
      dateEdit.value = dream.date || "";
      row.appendChild(genreSelect);
      row.appendChild(dateEdit);

      // メモ（何行でも書ける）
      const memoInput = document.createElement("textarea");
      memoInput.rows = 3;
      memoInput.placeholder = "メモ（思いや、かなえるための計画など）";
      memoInput.value = dream.memo || "";

      // 保存ボタンとやめるボタン
      const buttons = document.createElement("div");
      buttons.className = "row";
      const saveButton = document.createElement("button");
      saveButton.textContent = "保存";
      saveButton.className = "save-button";
      saveButton.addEventListener("click", function () {
        const newText = textInput.value.trim();
        if (newText === "") {
          return; // 夢の文章が空なら保存しない
        }
        dream.text = newText;
        dream.genre = genreSelect.value;
        dream.date = dateEdit.value;
        dream.memo = memoInput.value.trim();
        editingDream = null;
        save();
        show();
      });
      const cancelButton = document.createElement("button");
      cancelButton.textContent = "やめる";
      cancelButton.className = "cancel-button";
      cancelButton.addEventListener("click", function () {
        editingDream = null;
        show();
      });
      buttons.appendChild(saveButton);
      buttons.appendChild(cancelButton);

      form.appendChild(textInput);
      form.appendChild(row);
      form.appendChild(memoInput);
      form.appendChild(buttons);
      li.appendChild(form);
      return li;
    }

    // 今日から目標の日付まで、あと何日あるかを計算する
    function daysLeft(dateString) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(dateString + "T00:00:00");
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    // 「目標：2027年3月1日（あと143日）」のような文章を作る
    function makeDateText(dateString, done) {
      const parts = dateString.split("-");
      let result = "目標：" + parts[0] + "年" + Number(parts[1]) + "月" + Number(parts[2]) + "日";
      if (!done) {
        const days = daysLeft(dateString);
        if (days > 0) {
          result += "（あと" + days + "日）";
        } else if (days === 0) {
          result += "（今日！）";
        } else {
          result += "（" + (-days) + "日過ぎています）";
        }
      }
      return result;
    }

    // 夢を追加する
    function addDream() {
      const text = input.value.trim();
      if (text === "") {
        return; // 何も書いていなければ何もしない
      }
      dreams.push({ text: text, genre: genreInput.value, date: dateInput.value, done: false });
      input.value = "";
      dateInput.value = "";
      save();
      show();
    }

    addButton.addEventListener("click", addDream);

    // ジャンルや並び順を変えたら、表示しなおす
    genreFilter.addEventListener("change", show);
    sortOrder.addEventListener("change", show);

    // Enterキーでも追加できるようにする
    input.addEventListener("keydown", function (event) {
      if (isEnterToAdd(event)) {
        addDream();
      }
    });

    // 夢をファイルに書き出す（「ダウンロード」フォルダに保存されます）
    document.getElementById("export-button").addEventListener("click", function () {
      const today = new Date();
      const fileName = "手帳バックアップ-" + today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0") + ".json";
      const backup = { events: events, goals: goals, dreams: dreams, habits: habits, diary: diary, media: mediaItems };
      const file = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      link.download = fileName;
      link.click();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
    });

    // ファイルから夢を読み込む
    const importFile = document.getElementById("import-file");
    document.getElementById("import-button").addEventListener("click", function () {
      importFile.click(); // ファイルを選ぶ画面を開く
    });
    importFile.addEventListener("change", function () {
      const file = importFile.files[0];
      if (!file) {
        return;
      }
      const reader = new FileReader();
      reader.onload = function () {
        let loaded;
        try {
          loaded = JSON.parse(reader.result);
        } catch (error) {
          loaded = null;
        }
        // 前の形のファイル（夢だけ）にも対応する
        if (Array.isArray(loaded)) {
          loaded = { dreams: loaded };
        }
        // 手帳のバックアップファイルかどうか確かめる
        function isList(items, key) {
          return Array.isArray(items) && items.every(function (d) { return d && typeof d[key] === "string"; });
        }
        const hasDreams = loaded && isList(loaded.dreams, "text");
        const hasMedia = loaded && isList(loaded.media, "title");
        const hasHabits = loaded && isList(loaded.habits, "name");
        const hasDiary = loaded && loaded.diary && typeof loaded.diary === "object" && !Array.isArray(loaded.diary) &&
          Object.keys(loaded.diary).every(function (key) { return typeof loaded.diary[key] === "string"; });
        const hasEvents = loaded && isList(loaded.events, "text");
        const hasGoals = loaded && loaded.goals && typeof loaded.goals === "object" && !Array.isArray(loaded.goals) &&
          Object.keys(loaded.goals).every(function (key) { return isList(loaded.goals[key], "text"); });
        if (!hasDreams && !hasMedia && !hasHabits && !hasDiary && !hasEvents && !hasGoals) {
          alert("このファイルは手帳のバックアップではないようです。");
          importFile.value = "";
          return;
        }
        let message = "今の内容が、ファイルの内容に置きかわります。\n";
        if (hasEvents) message += "・予定：" + loaded.events.length + "個\n";
        if (hasGoals) message += "・目標\n";
        if (hasDreams) message += "・夢：" + loaded.dreams.length + "個\n";
        if (hasHabits) message += "・習慣：" + loaded.habits.length + "個\n";
        if (hasDiary) message += "・日記：" + Object.keys(loaded.diary).length + "日分\n";
        if (hasMedia) message += "・本と映画：" + loaded.media.length + "個\n";
        if (confirm(message + "よろしいですか？")) {
          if (hasEvents) {
            events = loaded.events;
            saveEvents();
          }
          if (hasGoals) {
            goals = loaded.goals;
            saveGoals();
          }
          if (hasEvents || hasGoals) {
            editingEvent = null;
            showPlans();
          }
          if (hasDreams) {
            dreams = loaded.dreams;
            editingDream = null;
            save();
            show();
          }
          if (hasHabits) {
            habits = loaded.habits.map(function (habit) {
              return { name: habit.name, done: habit.done || {} };
            });
            editingHabit = null;
            saveHabits();
            showHabits();
          }
          if (hasDiary) {
            clearTimeout(diaryTimer); // 読み込む内容で上書きするので、保存待ちは取り消す
            diaryTimer = null;
            diary = loaded.diary;
            saveDiary();
            openDiary(diaryDate);
          }
          if (hasMedia) {
            mediaItems = migrateMedia(loaded.media);
            editingMedia = null;
            saveMedia();
            showMedia();
          }
          alert("読み込みました！");
        }
        importFile.value = ""; // 同じファイルをもう一度選べるようにする
      };
      reader.readAsText(file);
    });

    // 最初に一度表示する
    show();
  </script>

  <script>
    // ============================================
    //  本・映画の記録
    // ============================================
    const MEDIA_STORAGE_KEY = "media";

    // 前の形（やることリスト型）のデータを、記録帳型に直す
    // ・読んだ・観たもの → 読んだ日をそのまま使う
    // ・まだのもの → 記録帳には入れない
    function migrateMedia(items) {
      return items
        .filter(function (item) { return item.date || item.done; })
        .map(function (item) {
          return {
            title: item.title,
            type: item.type === "映画" ? "映画" : "本",
            date: item.date || item.doneDate || todayString(),
            rating: item.rating || 0,
            memo: item.memo || "",
            added: item.added || 0
          };
        });
    }

    const savedMedia = JSON.parse(localStorage.getItem(MEDIA_STORAGE_KEY) || "[]");
    // 作り直す前のデータは、念のため別の名前で取っておく
    if (savedMedia.some(function (item) { return !item.date; }) && !localStorage.getItem("media-before-log")) {
      localStorage.setItem("media-before-log", JSON.stringify(savedMedia));
    }
    let mediaItems = migrateMedia(savedMedia);

    // いま書き直している記録（書き直していないときは null）
    let editingMedia = null;
    // 新しく記録するときの評価
    let newRating = 0;

    const mediaInput = document.getElementById("media-input");
    const mediaTypeInput = document.getElementById("media-type-input");
    const mediaDateInput = document.getElementById("media-date-input");
    const mediaMemoInput = document.getElementById("media-memo-input");
    const mediaRatingInput = document.getElementById("media-rating-input");
    const mediaList = document.getElementById("media-list");
    const mediaEmptyMessage = document.getElementById("media-empty-message");
    const mediaSummaryText = document.getElementById("media-summary-text");
    const mediaTypeFilter = document.getElementById("media-type-filter");

    function saveMedia() {
      localStorage.setItem(MEDIA_STORAGE_KEY, JSON.stringify(mediaItems));
      notifySaved("media");
    }

    // 今日の日付を「2026-10-09」の形で作る
    function todayString() {
      const today = new Date();
      return today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");
    }

    // 「2026年：本 12冊・映画 5本　／　これまで：本 30冊・映画 18本」を表示する
    function showMediaSummary() {
      if (mediaItems.length === 0) {
        mediaSummaryText.textContent = "読んだ本や観た映画を記録していきましょう";
        return;
      }
      function count(items) {
        const books = items.filter(function (item) { return item.type === "本"; }).length;
        return "本 " + books + "冊・映画 " + (items.length - books) + "本";
      }
      const year = todayString().slice(0, 4);
      const thisYear = mediaItems.filter(function (item) { return item.date.slice(0, 4) === year; });
      mediaSummaryText.textContent = year + "年：" + count(thisYear) + "　／　これまで：" + count(mediaItems);
    }

    // 星の評価（1〜5）を作る。押すと onChange が呼ばれる
    function makeStars(rating, onChange) {
      const stars = document.createElement("div");
      stars.className = "stars";
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement("button");
        star.textContent = "★";
        star.title = i + "つ星";
        if (rating >= i) {
          star.classList.add("on");
        }
        star.addEventListener("click", function () {
          // 同じ星をもう一度押すと、評価を消す
          onChange(rating === i ? 0 : i);
        });
        stars.appendChild(star);
      }
      return stars;
    }

    // 新しく記録する欄の星を表示する
    function showNewRating() {
      mediaRatingInput.innerHTML = "";
      mediaRatingInput.appendChild(makeStars(newRating, function (value) {
        newRating = value;
        showNewRating();
      }));
    }

    // 表示する記録を選んで、新しい順に並べる
    function mediaToShow() {
      return mediaItems
        .filter(function (item) {
          return mediaTypeFilter.value === "すべて" || item.type === mediaTypeFilter.value;
        })
        .sort(function (a, b) {
          if (a.date !== b.date) {
            return a.date < b.date ? 1 : -1;
          }
          return (b.added || 0) - (a.added || 0); // 同じ日なら、あとで記録したほうが上
        });
    }

    // 画面に記録を表示する（月ごとに区切る）
    function showMedia() {
      mediaList.innerHTML = "";
      showMediaSummary();

      const visible = mediaToShow();
      if (mediaItems.length === 0) {
        mediaEmptyMessage.textContent = "まだ記録がありません。上に書いてみましょう！";
      } else {
        mediaEmptyMessage.textContent = "表示する記録がありません。";
      }
      mediaEmptyMessage.hidden = visible.length > 0;

      let currentMonth = "";
      let ul = null;
      visible.forEach(function (item) {
        // 月が変わったら、見出しを入れる
        const month = item.date.slice(0, 7);
        if (month !== currentMonth) {
          currentMonth = month;
          const heading = document.createElement("h3");
          heading.className = "month-heading";
          heading.textContent = month.slice(0, 4) + "年" + Number(month.slice(5, 7)) + "月";
          ul = document.createElement("ul");
          mediaList.appendChild(heading);
          mediaList.appendChild(ul);
        }

        if (item === editingMedia) {
          ul.appendChild(makeMediaEditForm(item));
          return;
        }

        const li = document.createElement("li");

        // 読んだ日・観た日（「10/9」の形）
        const dateText = document.createElement("small");
        dateText.className = "log-date";
        dateText.textContent = Number(item.date.slice(5, 7)) + "/" + Number(item.date.slice(8, 10));

        // 種類の札
        const typeTag = document.createElement("small");
        typeTag.className = "genre-tag";
        typeTag.textContent = item.type;

        // タイトル
        const title = document.createElement("span");
        title.textContent = item.title;

        // 星（押すと評価を変えられる）
        const stars = makeStars(item.rating, function (value) {
          item.rating = value;
          saveMedia();
          showMedia();
        });

        // 編集ボタン
        const editButton = document.createElement("button");
        editButton.textContent = "編集";
        editButton.className = "edit-button";
        editButton.addEventListener("click", function () {
          editingMedia = item;
          showMedia();
        });

        // 削除ボタン（大切な記録なので、確認してから消す）
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除";
        deleteButton.className = "delete-button";
        deleteButton.addEventListener("click", function () {
          if (!confirm("「" + item.title + "」の記録を削除しますか？")) {
            return;
          }
          mediaItems.splice(mediaItems.indexOf(item), 1);
          saveMedia();
          showMedia();
        });

        li.appendChild(dateText);
        li.appendChild(typeTag);
        li.appendChild(title);
        li.appendChild(stars);
        li.appendChild(editButton);
        li.appendChild(deleteButton);

        // 感想（書いてある場合だけ表示する）
        if (item.memo) {
          const memo = document.createElement("div");
          memo.className = "memo";
          memo.textContent = item.memo;
          li.appendChild(memo);
        }

        ul.appendChild(li);
      });
    }

    // 記録を書き直すための入力欄を作る
    function makeMediaEditForm(item) {
      const li = document.createElement("li");
      const form = document.createElement("div");
      form.className = "edit-form";

      // タイトル・種類・日付
      const row = document.createElement("div");
      row.className = "row";
      const titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.value = item.title;
      titleInput.style.flex = "1";
      const typeSelect = document.createElement("select");
      ["本", "映画"].forEach(function (type) {
        const option = document.createElement("option");
        option.value = type;
        option.textContent = type;
        typeSelect.appendChild(option);
      });
      typeSelect.value = item.type;
      const dateEdit = document.createElement("input");
      dateEdit.type = "date";
      dateEdit.value = item.date;
      row.appendChild(titleInput);
      row.appendChild(typeSelect);
      row.appendChild(dateEdit);

      // 感想（何行でも書ける）
      const memoInput = document.createElement("textarea");
      memoInput.rows = 3;
      memoInput.placeholder = "感想・メモ";
      memoInput.value = item.memo || "";

      // 保存ボタンとやめるボタン
      const buttons = document.createElement("div");
      buttons.className = "row";
      const saveButton = document.createElement("button");
      saveButton.textContent = "保存";
      saveButton.className = "save-button";
      saveButton.addEventListener("click", function () {
        const newTitle = titleInput.value.trim();
        if (newTitle === "" || dateEdit.value === "") {
          return; // タイトルか日付が空なら保存しない
        }
        item.title = newTitle;
        item.type = typeSelect.value;
        item.date = dateEdit.value;
        item.memo = memoInput.value.trim();
        editingMedia = null;
        saveMedia();
        showMedia();
      });
      const cancelButton = document.createElement("button");
      cancelButton.textContent = "やめる";
      cancelButton.className = "cancel-button";
      cancelButton.addEventListener("click", function () {
        editingMedia = null;
        showMedia();
      });
      buttons.appendChild(saveButton);
      buttons.appendChild(cancelButton);

      form.appendChild(row);
      form.appendChild(memoInput);
      form.appendChild(buttons);
      li.appendChild(form);
      return li;
    }

    // 本・映画を記録する
    function addMedia() {
      const title = mediaInput.value.trim();
      if (title === "") {
        mediaInput.focus();
        return;
      }
      mediaItems.push({
        title: title,
        type: mediaTypeInput.value,
        date: mediaDateInput.value || todayString(),
        rating: newRating,
        memo: mediaMemoInput.value.trim(),
        added: Date.now()
      });
      // 書く欄を空にもどす（種類はそのまま）
      mediaInput.value = "";
      mediaMemoInput.value = "";
      mediaDateInput.value = todayString();
      newRating = 0;
      showNewRating();
      saveMedia();
      showMedia();
    }

    document.getElementById("media-add-button").addEventListener("click", addMedia);
    mediaInput.addEventListener("keydown", function (event) {
      if (isEnterToAdd(event)) {
        addMedia();
      }
    });
    mediaTypeFilter.addEventListener("change", showMedia);

    mediaDateInput.value = todayString();
    showNewRating();
    saveMedia();
    showMedia();

    // ============================================
    //  習慣トラッカー
    // ============================================
    const HABITS_STORAGE_KEY = "habits";

    // 習慣のリスト。done には、できた日が { "2026-10-09": true } の形で入る
    let habits = JSON.parse(localStorage.getItem(HABITS_STORAGE_KEY) || "[]");

    // いま名前を書き直している習慣（書き直していないときは null）
    let editingHabit = null;
    // 何週間前を表示しているか（0 = 今週）
    let weekOffset = 0;

    const habitInput = document.getElementById("habit-input");
    const habitHead = document.getElementById("habit-head");
    const habitBody = document.getElementById("habit-body");
    const habitEmptyMessage = document.getElementById("habit-empty-message");
    const nextWeekButton = document.getElementById("next-week");

    const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

    function saveHabits() {
      localStorage.setItem(HABITS_STORAGE_KEY, JSON.stringify(habits));
      notifySaved("habits");
    }

    // 日付を「2026-10-09」の形にする
    function dateKey(date) {
      return date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");
    }

    // 表示する7日間（いちばん右が今日。weekOffset 週ぶん前にずらす）
    function weekDays() {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const day = new Date();
        day.setDate(day.getDate() - i - weekOffset * 7);
        days.push(day);
      }
      return days;
    }

    // 何日連続でできているか
    // （今日まだ印がなくても、昨日まで続いていれば連続として数える）
    function streak(habit) {
      const day = new Date();
      if (!habit.done[dateKey(day)]) {
        day.setDate(day.getDate() - 1);
      }
      let count = 0;
      while (habit.done[dateKey(day)]) {
        count++;
        day.setDate(day.getDate() - 1);
      }
      return count;
    }

    // 表を表示する
    function showHabits() {
      showDiaryHabits(); // 日記のページの習慣も、同じ内容にそろえる
      const days = weekDays();
      const todayKey = dateKey(new Date());

      habitEmptyMessage.hidden = habits.length > 0;
      nextWeekButton.disabled = weekOffset === 0; // 未来の週には進めない

      // 見出しの行（日付と曜日）
      habitHead.innerHTML = "";
      const headRow = document.createElement("tr");
      const nameHead = document.createElement("th");
      nameHead.className = "habit-name";
      headRow.appendChild(nameHead);
      days.forEach(function (day) {
        const th = document.createElement("th");
        th.textContent = (day.getMonth() + 1) + "/" + day.getDate();
        th.appendChild(document.createElement("br"));
        th.appendChild(document.createTextNode(WEEKDAYS[day.getDay()]));
        if (dateKey(day) === todayKey) {
          th.classList.add("today");
        }
        headRow.appendChild(th);
      });
      const streakHead = document.createElement("th");
      streakHead.textContent = "連続";
      headRow.appendChild(streakHead);
      const totalHead = document.createElement("th");
      totalHead.textContent = "合計";
      headRow.appendChild(totalHead);
      headRow.appendChild(document.createElement("th"));
      habitHead.appendChild(headRow);

      // 習慣ごとの行
      habitBody.innerHTML = "";
      habits.forEach(function (habit) {
        const row = document.createElement("tr");

        // 習慣の名前（書き直し中なら入力欄）
        const nameCell = document.createElement("td");
        nameCell.className = "habit-name";
        if (habit === editingHabit) {
          const nameInput = document.createElement("input");
          nameInput.type = "text";
          nameInput.value = habit.name;
          nameInput.addEventListener("keydown", function (event) {
            if (isEnterToAdd(event)) {
              finishEdit();
            } else if (event.key === "Escape") {
              editingHabit = null;
              showHabits();
            }
          });
          function finishEdit() {
            const newName = nameInput.value.trim();
            if (newName !== "") {
              habit.name = newName;
              saveHabits();
            }
            editingHabit = null;
            showHabits();
          }
          nameCell.appendChild(nameInput);
          setTimeout(function () { nameInput.focus(); }, 0);
          nameInput.addEventListener("blur", finishEdit);
        } else {
          nameCell.textContent = habit.name;
        }
        row.appendChild(nameCell);

        // 7日分の ○（押すと ● になる）
        days.forEach(function (day) {
          const key = dateKey(day);
          const cell = document.createElement("td");
          if (key === todayKey) {
            cell.classList.add("today");
          }
          const dot = document.createElement("button");
          dot.className = "habit-dot";
          dot.title = (day.getMonth() + 1) + "/" + day.getDate() + "：" + habit.name;
          if (habit.done[key]) {
            dot.classList.add("on");
          }
          dot.addEventListener("click", function () {
            if (habit.done[key]) {
              delete habit.done[key];
            } else {
              habit.done[key] = true;
            }
            saveHabits();
            showHabits();
          });
          cell.appendChild(dot);
          row.appendChild(cell);
        });

        // 連続日数
        const streakCell = document.createElement("td");
        streakCell.className = "habit-streak";
        const count = streak(habit);
        streakCell.textContent = count > 0 ? count + "日" : "-";
        row.appendChild(streakCell);

        // 合計日数（これまでに印をつけた日の数）
        const totalCell = document.createElement("td");
        totalCell.className = "habit-total";
        totalCell.textContent = Object.keys(habit.done).length + "日";
        row.appendChild(totalCell);

        // 編集・削除ボタン
        const actionCell = document.createElement("td");
        actionCell.className = "habit-actions";
        const editButton = document.createElement("button");
        editButton.textContent = "編集";
        editButton.className = "edit-button";
        editButton.addEventListener("click", function () {
          editingHabit = habit;
          showHabits();
        });
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除";
        deleteButton.className = "delete-button";
        deleteButton.style.marginLeft = "8px";
        deleteButton.addEventListener("click", function () {
          if (!confirm("「" + habit.name + "」を削除しますか？これまでの記録も消えます。")) {
            return;
          }
          habits.splice(habits.indexOf(habit), 1);
          saveHabits();
          showHabits();
        });
        actionCell.appendChild(editButton);
        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);

        habitBody.appendChild(row);
      });
    }

    // 日記のページに、開いている日付の習慣を表示する
    function showDiaryHabits() {
      const box = document.getElementById("diary-habits");
      const key = document.getElementById("diary-date-input").value;
      box.innerHTML = "";
      box.hidden = habits.length === 0 || key === "";
      if (box.hidden) {
        return;
      }

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = key === dateKey(new Date()) ? "今日の習慣" : "この日の習慣";
      box.appendChild(label);

      habits.forEach(function (habit) {
        const chip = document.createElement("button");
        chip.className = "habit-chip";
        chip.textContent = habit.name;
        if (habit.done[key]) {
          chip.classList.add("on");
        }
        chip.addEventListener("click", function () {
          if (habit.done[key]) {
            delete habit.done[key];
          } else {
            habit.done[key] = true;
          }
          saveHabits();
          showHabits(); // Habits のページと日記のページの両方を表示しなおす
        });
        box.appendChild(chip);
      });
    }

    // 習慣を追加する
    function addHabit() {
      const name = habitInput.value.trim();
      if (name === "") {
        return;
      }
      habits.push({ name: name, done: {} });
      habitInput.value = "";
      saveHabits();
      showHabits();

    document.getElementById("habit-add-button").addEventListener("click", addHabit);
    habitInput.addEventListener("keydown", function (event) {

    document.getElementById("prev-week").addEventListener("click", function () {

    // ============================================
    //  日記
    // ============================================
    const DIARY_STORAGE_KEY = "diary";

    // 日記。{ "2026-10-09": "今日は…", ... } の形で入る
    let diary = JSON.parse(localStorage.getItem(DIARY_STORAGE_KEY) || "{}");

    // いま開いている日付
    let diaryDate = dateKey(new Date());

    const diaryHeading = document.getElementById("diary-heading");
    const diaryDateInput = document.getElementById("diary-date-input");
    const diaryText = document.getElementById("diary-text");
    const diaryStatus = document.getElementById("diary-status");
    const diaryList = document.getElementById("diary-list");
    const diaryEmptyMessage = document.getElementById("diary-empty-message");

    function saveDiary() {
      localStorage.setItem(DIARY_STORAGE_KEY, JSON.stringify(diary));
      notifySaved("diary");
    }

    // 「2026-10-09」を Date にする
    function parseDate(key) {
      return new Date(key + "T00:00:00");
    }

    // 「2026年10月9日（金）」の形にする
    function longDate(key) {
      const day = parseDate(key);
      return day.getFullYear() + "年" + (day.getMonth() + 1) + "月" + day.getDate() + "日（" + WEEKDAYS[day.getDay()] + "）";
    }

    // 指定した日付の日記を開く
    function openDiary(key) {
      flushDiary(); // まだ保存していない文字があれば、先に保存する
      diaryDate = key;
      diaryDateInput.value = key;
      diaryHeading.textContent = longDate(key);
      diaryText.value = diary[key] || "";
      diaryText.placeholder = key === dateKey(new Date()) ? "今日はどんな一日でしたか？" : "この日はどんな一日でしたか？";
      diaryStatus.textContent = "";
      showDiaryList();
      showDiaryHabits();
    }

    // 書いている内容を保存する（文字を消して空になったら、その日の日記をなくす）
    function storeDiary() {
      const text = diaryText.value.trim();
      if (text === "") {
        delete diary[diaryDate];
      } else {
        diary[diaryDate] = diaryText.value;
      }
      saveDiary();
    }

    // 書くたびに、少し待ってから自動で保存する
    let diaryTimer = null;
    diaryText.addEventListener("input", function () {
      diaryStatus.textContent = "…";
      clearTimeout(diaryTimer);
      diaryTimer = setTimeout(function () {
        diaryTimer = null;
        storeDiary();
        diaryStatus.textContent = "保存しました";
        showDiaryList();
      }, 600);
    });

    // 保存を待っている文字があれば、すぐに保存する
    function flushDiary() {
      if (diaryTimer) {
        clearTimeout(diaryTimer);
        diaryTimer = null;
        storeDiary();
      }
    }

    // ブラウザを閉じるときも、保存を待っている文字を保存する
    window.addEventListener("beforeunload", flushDiary);

    // 過去の日記の一覧を表示する（新しい順・月ごとに区切る）
    function showDiaryList() {
      diaryList.innerHTML = "";
      const keys = Object.keys(diary).sort().reverse();
      diaryEmptyMessage.hidden = keys.length > 0;

      let currentMonth = "";
      let ul = null;
      keys.forEach(function (key) {
        const month = key.slice(0, 7);
        if (month !== currentMonth) {
          currentMonth = month;
          const heading = document.createElement("h3");
          heading.className = "month-heading";
          heading.textContent = month.slice(0, 4) + "年" + Number(month.slice(5, 7)) + "月";
          ul = document.createElement("ul");
          diaryList.appendChild(heading);
          diaryList.appendChild(ul);
        }

        const li = document.createElement("li");
        li.className = "diary-entry";
        if (key === diaryDate) {
          li.classList.add("current");
        }

        // 「10/9（金）」
        const day = parseDate(key);
        const dateText = document.createElement("small");
        dateText.className = "log-date";
        dateText.textContent = (day.getMonth() + 1) + "/" + day.getDate() + "（" + WEEKDAYS[day.getDay()] + "）";

        // 書き出し（1行目だけ）
        const preview = document.createElement("span");
        preview.textContent = diary[key].trim().split("\n")[0];

        // 削除ボタン（大切な日記なので、確認してから消す）

        deleteButton.textContent = "削除";
        deleteButton.className = "delete-button";
        deleteButton.addEventListener("click", function (event) {
          event.stopPropagation(); // 日記を開く動きが起きないようにする
          if (!confirm(longDate(key) + "の日記を削除しますか？")) {
            return;
          }
          if (key === diaryDate) {
            clearTimeout(diaryTimer); // 開いている日記なら、保存待ちも取り消す
            diaryTimer = null;
            diaryText.value = "";
            diaryStatus.textContent = "削除しました";
          }
          delete diary[key];
          saveDiary();
          showDiaryList();
        });

        li.appendChild(dateText);
        li.appendChild(preview);
        li.appendChild(deleteButton);
        // 押すと、その日の日記を開く
        li.addEventListener("click", function () {
          openDiary(key);
          window.scrollTo({ top: 0, behavior: "smooth" });

        });
        ul.appendChild(li);
      });
    }

    diaryDateInput.addEventListener("change", function () {
      if (diaryDateInput.value) {
